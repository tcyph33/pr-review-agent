      // Recorded straight away rather than waiting for the next poll, so the
      // card flips to the running state on this click
      activeReruns.set(reviewId, startedAt);
      applyControls();
    } catch (err) {
      button.textContent = originalText;
      button.disabled = false;
      delete button.dataset.warned;
      showError(`Could not start the re-run: ${err.message}`);
    }
  }

  async function cancelRerun(button) {
    const reviewId = button.getAttribute("data-id");
    button.textContent = "Stopping...";
    button.disabled = true;

    if (MOCK_MODE) {
      // A cancel is not a failure, so no notice is left behind — same as live
      activeReruns.delete(reviewId);
      applyControls();
      return;
    }

    try {
      const response = await fetch(`/api/reviews/${encodeURIComponent(reviewId)}/rerun`, { method: "DELETE" });
      if (!response.ok) {
        const payload = await response.json().catch(() => ({}));
        throw new Error(payload.error ?? `HTTP ${response.status}`);
      }
      // Dropped locally so the card stops showing a run the agent is no longer
      // doing; the next poll confirms it from the server
      activeReruns.delete(reviewId);
      applyControls();
    } catch (err) {
      button.textContent = "Cancel run";
      button.disabled = false;
      showError(`Could not cancel the re-run: ${err.message}`);
    }
  }

  async function rerunFromCommitsModal() {
    if (!currentCommitsId) return;
    const noteElement = document.getElementById("commits-rerun-note");
    try {
      const startedAt = await postRerun(currentCommitsId);
      activeReruns.set(currentCommitsId, startedAt);
      applyControls();
      noteElement.innerHTML = `<div class="queue-success">The agent is running. Its progress shows on the card, and the dashboard picks up the new review when it finishes.</div>`;
    } catch (err) {
      noteElement.innerHTML = `<div class="queue-error-box">Could not start the re-run: ${escHtml(err.message)}</div>`;
    }
  }

  function clearQueueError(index) {
    const errorElement = document.getElementById(`queue-error-${index}`);
    if (errorElement) errorElement.textContent = "";
  }

  function openCommentEditor(index) {
    findingsBeingEdited.add(index);
    refreshFindingQueue(index);
    const textarea = document.getElementById(`queue-text-${index}`);
    if (textarea) textarea.focus();
  }

  function cancelCommentEditor(index) {
    findingsBeingEdited.delete(index);
    refreshFindingQueue(index);
  }

  function queueComment(index) {
    const textarea = document.getElementById(`queue-text-${index}`);
    if (!textarea) return;

    // A blank comment has nothing to post, so refuse instead of queueing it
    const text = textarea.value.trim();
    const isEmpty = text.length === 0;
    if (isEmpty) {
      const errorElement = document.getElementById(`queue-error-${index}`);
      if (errorElement) errorElement.textContent = "Write a comment first.";
      return;
    }

    const key = findingKey(currentFindings[index]);
    queuedCommentsByKey.set(key, text);
    // Queued and ignored are exclusive — deciding to comment undoes the skip
    ignoredKeys.delete(key);
    findingsBeingEdited.delete(index);
    saveReviewQueue(currentReview);
    refreshFindingQueue(index);
    queueResultHtml = "";
    refreshQueuePartition();
  }

  function removeQueuedComment(index) {
    queuedCommentsByKey.delete(findingKey(currentFindings[index]));
    findingsBeingEdited.delete(index);
    saveReviewQueue(currentReview);
    refreshFindingQueue(index);
    queueResultHtml = "";
    refreshQueuePartition();
  }

  // Clearing is local only — a pending review already on GitHub is left alone,
  // so the message hands back its link rather than implying it was cleaned up.
  function ignoreFinding(index) {
    const key = findingKey(currentFindings[index]);

    // Any draft goes with it: keeping one would leave text queued for a finding
    // the card says is being skipped
    queuedCommentsByKey.delete(key);
    ignoredKeys.add(key);
    findingsBeingEdited.delete(index);

    saveReviewQueue(currentReview);
    refreshFindingQueue(index);
    queueResultHtml = "";
    refreshQueuePartition();
  }

  function unignoreFinding(index) {
    ignoredKeys.delete(findingKey(currentFindings[index]));
    saveReviewQueue(currentReview);
    refreshFindingQueue(index);
    renderQueueFooter();
  }

  function clearQueuedComments() {
    const pendingUrl = sentState === null ? null : sentState.url;

    queuedCommentsByKey.clear();
    ignoredKeys.clear();
    findingsBeingEdited.clear();
    sentState = null;
    lastPartition = null;
    orphanedPendingUrl = null;
    saveReviewQueue(currentReview);
    currentFindings.forEach((finding, index) => refreshFindingQueue(index));

    queueResultHtml = pendingUrl === null
      ? ""
      : `<div class="queue-info">Queue cleared. The pending review is still on GitHub — <a href="${escHtml(pendingUrl)}" target="_blank" rel="noreferrer">open it</a> to submit or delete it.</div>`;
    renderQueueFooter();
  }

  // ── Sending the queue to GitHub as a pending review ──

  // Splits the queue into comments GitHub can anchor inline and ones it cannot,
  // judged against the supplied diff rather than any cached copy.
  function partitionQueuedComments(diff) {
    const placeable = [];
    const unplaceable = [];

    for (const finding of currentFindings) {
      const key  = findingKey(finding);
      const text = queuedCommentsByKey.get(key);
      if (text === undefined) continue;

      const hasLine = finding.line !== null && finding.line !== undefined;
      const file    = diff.files.find((candidate) => candidate.filename === finding.file);

      let reason = null;
      if (!hasLine)      reason = "the finding is file-level, with no line to anchor to";
      else if (!file)    reason = `${finding.file} is not part of this PR's diff`;
      else if (!file.patch) reason = `GitHub provides no patch for ${finding.file}`;
      else if (!isLineInDiff(file, finding.line)) {
        reason = `line ${finding.line} falls outside the changed hunks`;
      }

      const isPlaceable = reason === null;
      if (isPlaceable) placeable.push({ path: finding.file, line: finding.line, body: text, key });
      else unplaceable.push({ finding, text, reason, key });
    }

    return { placeable, unplaceable };
  }

  async function refreshQueuePartition() {
    const hasQueue = queuedCommentsByKey.size > 0;
    if (!hasQueue) {
      lastPartition = null;
      renderQueueFooter();
      return;
    }
    try {
      lastPartition = partitionQueuedComments(await fetchDiff(currentReview));
    } catch {
      // Without a diff we simply cannot report the split; the footer omits it
      lastPartition = null;
    }
    renderQueueFooter();
  }

  function setQueueResult(cssClass, html) {
    queueResultHtml = `<div class="${cssClass}">${html}</div>`;
    renderQueueFooter();
  }

  async function fetchPendingReview(reviewId) {
    const response = await fetch(`/api/reviews/${encodeURIComponent(reviewId)}/pending-review`);
    if (!response.ok) {
      const payload = await response.json().catch(() => ({}));
      throw new Error(payload.error ?? `HTTP ${response.status}`);
    }
    const payload = await response.json();
    return payload.pending;
  }

  async function startPendingReview() {
    setQueueResult("queue-working", "Validating comments against the current diff…");

    // Re-fetch rather than trusting the copy cached when the modal opened: stale
    // line numbers are the main reason GitHub rejects a comment position.
    diffCacheByReviewId.delete(currentReview.id);

    let partition;
    try {
      partition = partitionQueuedComments(await fetchDiff(currentReview));
      lastPartition = partition;
    } catch (err) {
      setQueueResult("queue-error-box", `Could not load the diff to validate comments: ${escHtml(err.message)}`);
      return;
    }

    const hasPlaceable = partition.placeable.length > 0;
    if (!hasPlaceable) {
      setQueueResult("queue-error-box", "None of the queued comments can be anchored to this PR's diff, so there is nothing to send. Use Copy all and add them in GitHub instead.");
      return;
    }

    if (MOCK_MODE) {
      sentState = {
        keys: partition.placeable.map((comment) => comment.key),
        positions: partition.placeable.map((comment) => ({ path: comment.path, line: comment.line })),
        reviewId: 1,
        url: currentReview.url,
      };
      saveReviewQueue(currentReview);
      setQueueResult("queue-success", `Mock mode: pretended to create a pending review with ${partition.placeable.length} comment(s).`);
      return;
    }

    // GitHub allows one pending review per PR, so find out before trying
    setQueueResult("queue-working", "Checking for an existing pending review…");
    let pending;
    try {
      pending = await fetchPendingReview(currentReview.id);
    } catch (err) {
      setQueueResult("queue-error-box", `Could not check for an existing pending review: ${escHtml(err.message)}`);
      return;
    }

    let replaceReviewId = null;
    if (pending) {
      // Anything in the draft that we did not put there was added by hand in
      // GitHub, and replacing would destroy it — so that path is not offered.
      const ourPositions = new Set((sentState?.positions ?? []).map((position) => `${position.path}:${position.line}`));
      const manualComments = pending.comments.filter((comment) => !ourPositions.has(`${comment.path}:${comment.line}`));

      const hasManualComments = manualComments.length > 0;
      if (hasManualComments) {
        setQueueResult("queue-error-box",
          `You've added ${manualComments.length} comment${manualComments.length === 1 ? "" : "s"} in GitHub since this review was started. `
          + `Updating would discard ${manualComments.length === 1 ? "it" : "them"}, so it isn't offered. `
          + `Add the new comment in GitHub instead — use Copy all above — or `
          + `<a href="${escHtml(pending.htmlUrl)}" target="_blank" rel="noreferrer">open the pending review</a>.`);
        return;
      }
      replaceReviewId = pending.id;
    }

    setQueueResult("queue-working", replaceReviewId === null ? "Creating the pending review…" : "Updating the pending review…");

    try {
      const response = await fetch(`/api/reviews/${encodeURIComponent(currentReview.id)}/start-review`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          comments: partition.placeable.map((comment) => ({ path: comment.path, line: comment.line, body: comment.body })),
          replaceReviewId,
        }),
      });
      const payload = await response.json().catch(() => ({}));

      if (!response.ok) {
        setQueueResult("queue-error-box",
          `GitHub rejected the review, so nothing was created and your queue is unchanged.`
          + `<div class="queue-error-detail">${escHtml(payload.error ?? `HTTP ${response.status}`)}</div>`
          + `<div class="queue-error-detail">All ${partition.placeable.length} comment(s) passed our diff validation, so GitHub applied a stricter rule than we model.</div>`);
        return;
      }

      sentState = {
        keys: partition.placeable.map((comment) => comment.key),
        positions: partition.placeable.map((comment) => ({ path: comment.path, line: comment.line })),
        reviewId: payload.review.id,
        url: payload.review.htmlUrl,
      };
      saveReviewQueue(currentReview);

      // GitHub should hold this as a draft; if it did not, say so plainly
      const isPending = payload.review.state === "PENDING";
      if (!isPending) {
        setQueueResult("queue-error-box",
          `GitHub reported this review as <strong>${escHtml(payload.review.state)}</strong> rather than PENDING, which means it published instead of drafting. `
          + `<a href="${escHtml(payload.review.htmlUrl)}" target="_blank" rel="noreferrer">Open it</a> to dismiss if that wasn't what you wanted.`);
        return;
      }

      setQueueResult("queue-success",
        `Pending review ready with ${partition.placeable.length} comment${partition.placeable.length === 1 ? "" : "s"}. `
        + `<a href="${escHtml(payload.review.htmlUrl)}" target="_blank" rel="noreferrer">Open it on GitHub</a> to add more and submit.`);
    } catch (err) {
      setQueueResult("queue-error-box", `Could not reach the dashboard server: ${escHtml(err.message)}`);
    }
  }

  async function copyTextToClipboard(text, successMessage) {
    try {
      await navigator.clipboard.writeText(text);
      setQueueResult("queue-success", escHtml(successMessage));
    } catch {
      setQueueResult("queue-error-box", "Could not write to the clipboard — your browser may block it here.");
    }
  }

  function queuedCommentAsText(finding, text) {
    const where = finding.line === null || finding.line === undefined
      ? finding.file
      : `${finding.file}:${finding.line}`;
    return `${where}\n${text}\n`;
  }

  async function copyAllQueuedComments() {
    const blocks = [];
    for (const finding of currentFindings) {
      const text = queuedCommentsByKey.get(findingKey(finding));
      if (text === undefined) continue;
      blocks.push(queuedCommentAsText(finding, text));
    }
    await copyTextToClipboard(blocks.join("\n"), `${blocks.length} comment${blocks.length === 1 ? "" : "s"} copied.`);
  }

  async function copyUnplaceableComment(index) {
    const item = lastPartition?.unplaceable?.[index];
    if (!item) return;
    await copyTextToClipboard(queuedCommentAsText(item.finding, item.text), "Comment copied.");
  }

  function buildQueueFooterHtml() {
    const sections = [];
    const queuedCount = queuedCommentsByKey.size;
    const hasSent = sentState !== null;

    if (wasRegenerated) {
      const orphanNote = orphanedPendingUrl === null
        ? ""
        : ` <a href="${escHtml(orphanedPendingUrl)}" target="_blank" rel="noreferrer">A pending review from before is still on GitHub.</a>`;
      sections.push(`<div class="queue-notice">This review was regenerated for new commits, so earlier drafts were cleared.${orphanNote}</div>`);
    }

    // Status line: what is queued, what is already on GitHub, and the drift between them
    const sentKeys = new Set(hasSent ? sentState.keys : []);
    const addedSinceSent   = [...queuedCommentsByKey.keys()].filter((key) => !sentKeys.has(key)).length;
    const removedSinceSent = hasSent ? sentState.keys.filter((key) => !queuedCommentsByKey.has(key)).length : 0;
    const hasChanges = addedSinceSent > 0 || removedSinceSent > 0;

    let status;
    if (hasSent) {
      const sentCount = sentState.keys.length;
      status = `Pending review on GitHub · ${sentCount} comment${sentCount === 1 ? "" : "s"}`;
      if (hasChanges) {
        const changes = [];
        if (addedSinceSent > 0)   changes.push(`+${addedSinceSent} new`);
        if (removedSinceSent > 0) changes.push(`${removedSinceSent} removed`);
        status += ` · ${changes.join(", ")}`;
      }
    } else if (queuedCount === 0) {
      status = "Nothing queued";
    } else {
      status = `${queuedCount} comment${queuedCount === 1 ? "" : "s"} queued`;
    }

    const hasSplit = lastPartition !== null && lastPartition.unplaceable.length > 0;
    if (hasSplit) status += ` · ${lastPartition.placeable.length} can be placed inline`;

    // Named rather than left implicit: when you submit, what you deliberately
    // left out is as much a part of the review as what you queued
    const ignoredCount = ignoredKeys.size;
    if (ignoredCount > 0) status += ` · ${ignoredCount} ignored`;

    // An ignore is local. A finding already pushed into the pending review is
    // still in GitHub's draft until the review is rebuilt from the local set.
    const ignoredStillSent = hasSent
      ? sentState.keys.filter((key) => ignoredKeys.has(key)).length
      : 0;
    if (ignoredStillSent > 0) {
      sections.push(
        `<div class="queue-notice">${ignoredStillSent} ignored finding${ignoredStillSent === 1 ? " is" : "s are"}`
        + ` still in the draft on GitHub. Update the review to drop ${ignoredStillSent === 1 ? "it" : "them"}.</div>`
      );
    }

    const buttons = [];
    if (hasSent) {
      buttons.push(`<a class="btn-ghost btn-link" href="${escHtml(sentState.url)}" target="_blank" rel="noreferrer">Open on GitHub</a>`);
      if (hasChanges && queuedCount > 0) buttons.push(`<button class="btn-queue" onclick="startPendingReview()">Update review</button>`);
    } else if (queuedCount > 0) {
      buttons.push(`<button class="btn-queue" onclick="startPendingReview()">Start review on GitHub</button>`);
    }
    if (queuedCount > 0) buttons.push(`<button class="btn-ghost" onclick="copyAllQueuedComments()">Copy all</button>`);
    if (queuedCount > 0 || hasSent) buttons.push(`<button class="btn-ghost" onclick="clearQueuedComments()">Clear queue</button>`);

    sections.push(`
      <div class="queue-footer-row">
        <span class="queue-count">${status}</span>
        <div class="queue-actions">${buttons.join("")}</div>
      </div>`);

    // Comments GitHub cannot anchor: named individually, with nothing sent for them
    if (hasSplit) {
      sections.push(`
        <div class="queue-unplaceable">
          <div class="queue-unplaceable-title">${lastPartition.unplaceable.length} comment${lastPartition.unplaceable.length === 1 ? "" : "s"} can't be placed inline and won't be sent</div>
          ${lastPartition.unplaceable.map((item, index) => `
            <div class="queue-unplaceable-item">
              <span class="queue-unplaceable-where">${escHtml(item.finding.file)}${item.finding.line === null || item.finding.line === undefined ? "" : ":" + escHtml(String(item.finding.line))}</span>
              <span class="queue-unplaceable-reason">${escHtml(item.reason)}</span>
              <button class="btn-queue-remove" onclick="copyUnplaceableComment(${index})">Copy</button>
            </div>`).join("")}
        </div>`);
    }

    if (queueResultHtml) sections.push(queueResultHtml);
    return sections.join("");
  }

  function renderQueueFooter() {
    const footerElement = document.getElementById("review-modal-footer");
    const isVisible = queuedCommentsByKey.size > 0 || ignoredKeys.size > 0
      || sentState !== null || wasRegenerated || queueResultHtml !== "";

    footerElement.style.display = isVisible ? "" : "none";
    if (!isVisible) {
      footerElement.innerHTML = "";
      return;
    }
    footerElement.innerHTML = buildQueueFooterHtml();
  }

  // ── PR diff panel ──
  const DIFF_STATUS_LETTER = {
    added: "A", removed: "D", modified: "M",
    renamed: "R", copied: "C", changed: "M", unchanged: "=",
  };
  const diffCacheByReviewId = new Map();
  let currentDiffFiles = [];
  let currentReview = null;

  // Reset to hidden every time a review opens. The review text is what you came
  // for; showing the diff is a deliberate second step, not a remembered mode.
  let diffPaneHidden = true;

  // Parses a unified diff into rows carrying both old and new line numbers.
  // The line numbers are what lets a finding be located inside a hunk, rather
  // than the rows only being colour-coded.
  function parsePatch(patch) {
    const rows = [];
    let oldLineNumber = 0;
    let newLineNumber = 0;

    for (const line of String(patch ?? "").split("\n")) {
      // Trailing artefact of the split, not a diff row
      if (line === "") continue;

      // A hunk header restarts both counters at the hunk's declared start lines
      const hunkMatch = line.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
      if (hunkMatch) {
        oldLineNumber = parseInt(hunkMatch[1], 10);
        newLineNumber = parseInt(hunkMatch[2], 10);
        rows.push({ type: "hunk", oldLine: null, newLine: null, text: line });
        continue;
      }

      // Classify by diff marker, advancing only the side the row exists on
      const marker = line[0];
      if (marker === "+") {
        rows.push({ type: "add", oldLine: null, newLine: newLineNumber, text: line.slice(1) });
        newLineNumber += 1;
      } else if (marker === "-") {
        rows.push({ type: "del", oldLine: oldLineNumber, newLine: null, text: line.slice(1) });
        oldLineNumber += 1;
      } else if (marker === "\\") {
        rows.push({ type: "meta", oldLine: null, newLine: null, text: line });
      } else {
        rows.push({ type: "ctx", oldLine: oldLineNumber, newLine: newLineNumber, text: line.slice(1) });
        oldLineNumber += 1;
        newLineNumber += 1;
      }
    }

    return rows;
  }

  function renderDiffRows(rows, highlightNewLine = null) {
    const rowsHtml = rows.map((row) => {
      if (row.type === "hunk") {
        return `<tr class="diff-row-hunk"><td colspan="3">${escHtml(row.text)}</td></tr>`;
      }
      if (row.type === "meta") {
        return `<tr class="diff-row-meta"><td class="diff-ln"></td><td class="diff-ln"></td><td class="diff-code">${escHtml(row.text)}</td></tr>`;
      }
      const baseClass = row.type === "add" ? "diff-row-add" : row.type === "del" ? "diff-row-del" : "diff-row-ctx";
      const isTarget  = highlightNewLine !== null && row.newLine === highlightNewLine;
      const rowClass  = isTarget ? `${baseClass} diff-row-target` : baseClass;
      const marker    = row.type === "add" ? "+" : row.type === "del" ? "-" : " ";
      return `<tr class="${rowClass}" data-new-line="${row.newLine ?? ""}">
          <td class="diff-ln">${row.oldLine ?? ""}</td>
          <td class="diff-ln">${row.newLine ?? ""}</td>
          <td class="diff-code">${escHtml(marker + row.text)}</td>
        </tr>`;
    }).join("");
    return `<table class="diff-table">${rowsHtml}</table>`;
  }

  function renderDiffFileBody(file) {
    const hasPatch = Boolean(file && file.patch);
    if (!hasPatch) {
      return `<div class="diff-nopatch">No inline diff — GitHub omits the patch for binary and very large files.</div>`;
    }
    return renderDiffRows(parsePatch(file.patch));
  }

  function renderDiffFileRow(file, index) {
    const status       = String(file.status ?? "modified");
    const statusLetter = DIFF_STATUS_LETTER[status] ?? "M";
    return `
      <div class="diff-file" id="diff-file-${index}">
        <div class="diff-file-row" onclick="toggleDiffFile(${index})">
          <span class="diff-caret">▸</span>
          <span class="diff-status diff-status-${escHtml(status)}" title="${escHtml(status)}">${statusLetter}</span>
          <span class="diff-name">${escHtml(file.filename)}</span>
          <span class="diff-counts"><span class="diff-add">+${file.additions ?? 0}</span> <span class="diff-del">−${file.deletions ?? 0}</span></span>
        </div>
        <div class="diff-body"></div>
      </div>`;
  }

  function toggleDiffFile(index) {
    const fileElement = document.getElementById(`diff-file-${index}`);
    if (!fileElement) return;

    // Render the patch on first open only. Building every file's rows up front
    // would put tens of thousands of hidden table rows in the DOM on a large PR.
    const bodyElement  = fileElement.querySelector(".diff-body");
    const isOpening    = !fileElement.classList.contains("open");
    const isUnrendered = bodyElement.dataset.rendered !== "true";
    if (isOpening && isUnrendered) {
      bodyElement.innerHTML = renderDiffFileBody(currentDiffFiles[index]);
      bodyElement.dataset.rendered = "true";
    }

    fileElement.classList.toggle("open");
  }

  function renderDiffPanel(diff, review) {
    currentDiffFiles = diff.files;

    const shownCount = diff.files.length;
    const totalCount = review.filesChanged ?? shownCount;

    const header = `
      <div class="diff-head">
        <span class="diff-head-title">Files changed</span>
        <span class="diff-head-stats">${totalCount} · <span class="diff-add">+${review.additions ?? 0}</span> <span class="diff-del">−${review.deletions ?? 0}</span></span>
      </div>`;

    const hasFiles = shownCount > 0;
    if (!hasFiles) {
      return header + `<div class="diff-note">No file changes reported for this PR.</div>`;
    }

    const isTruncated = diff.truncated && totalCount > shownCount;
    const truncationNote = isTruncated
      ? `<div class="diff-truncated">Showing the first ${shownCount} of ${totalCount} files. Open the PR on GitHub for the rest.</div>`
      : "";

    const fileRows = diff.files.map((file, index) => renderDiffFileRow(file, index)).join("");
    return header + truncationNote + fileRows;
  }

  async function fetchDiffFromServer(reviewId) {
    const response = await fetch(`/api/diff/${encodeURIComponent(reviewId)}`);
    if (!response.ok) {
      const payload = await response.json().catch(() => ({}));
      throw new Error(payload.error ?? `HTTP ${response.status}`);
    }
    const diff = await response.json();
    return diff;
  }

  async function fetchDiff(review) {
    if (diffCacheByReviewId.has(review.id)) {
      return diffCacheByReviewId.get(review.id);
    }
    const diff = MOCK_MODE ? mockDiff(review) : await fetchDiffFromServer(review.id);
    diffCacheByReviewId.set(review.id, diff);
    return diff;
  }

  async function loadDiffPanel(review) {
    const panelElement = document.getElementById("diff-panel");
    panelElement.innerHTML = `<div class="diff-note">Loading diff…</div>`;
    try {
      const diff = await fetchDiff(review);
      panelElement.innerHTML = renderDiffPanel(diff, review);
    } catch (err) {
      currentDiffFiles = [];
      panelElement.innerHTML = `<div class="diff-note">Could not load the diff: ${escHtml(err.message)}</div>`;
    }
  }

  function applyDiffPaneVisibility() {
    document.getElementById("modal-split").classList.toggle("diff-hidden", diffPaneHidden);
    document.getElementById("diff-toggle-btn").textContent = diffPaneHidden ? "Show diff" : "Hide diff";
  }

  function setDiffPaneHidden(hidden) {
    diffPaneHidden = hidden;
    applyDiffPaneVisibility();
  }

  function toggleDiffPane() {
    setDiffPaneHidden(!diffPaneHidden);
  }

  // Whether a finding's line exists on the right side of the diff, which is what
  // decides if GitHub can anchor an inline comment to it.
  function isLineInDiff(file, line) {
    return parsePatch(file.patch).some((row) => row.newLine === line);
  }

  function highlightDiffRow(fileIndex, line) {
    const hasLine = line !== null && line !== undefined;
    if (!hasLine) return;

    const fileElement = document.getElementById(`diff-file-${fileIndex}`);
    if (!fileElement) return;

    const targetRow = fileElement.querySelector(`tr[data-new-line="${line}"]`);
    if (!targetRow) return;

    // Only one row in the pane carries the highlight at a time
    document.querySelectorAll(".modal-pane-diff .diff-row-target")
      .forEach((row) => row.classList.remove("diff-row-target"));
    targetRow.classList.add("diff-row-target");
    targetRow.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  async function jumpToDiffFile(index) {
    const finding = currentFindings[index];
    if (!finding) return;

    // A collapsed pane has nowhere to scroll to, so reveal it first
    if (diffPaneHidden) setDiffPaneHidden(false);

    let diff;
    try {
      diff = await fetchDiff(currentReview);
    } catch (err) {
      showError(`Could not load the diff: ${err.message}`);
      return;
    }

    // Say why nothing happened rather than appearing to be a dead button
    const fileIndex = diff.files.findIndex((candidate) => candidate.filename === finding.file);
    const isFileInDiff = fileIndex >= 0;
    if (!isFileInDiff) {
      showError(`${finding.file} is not part of this PR's diff, so there is nothing to show.`);
      return;
    }

    const fileElement = document.getElementById(`diff-file-${fileIndex}`);
    if (!fileElement) return;

    // Collapse every other file so the jump lands on one focused diff. Their
    // rendered rows stay in the DOM, so reopening one by hand is still instant.
    document.querySelectorAll(".modal-pane-diff .diff-file.open").forEach((openFile) => {
      if (openFile !== fileElement) openFile.classList.remove("open");
    });

    if (!fileElement.classList.contains("open")) toggleDiffFile(fileIndex);
    highlightDiffRow(fileIndex, finding.line);
  }

  function openReviewModalByIdx(el) {
    const reviewIndex = parseInt(el.getAttribute('data-review-idx'), 10);
    const review = filteredReviews[reviewIndex];
    if (!review) return;
    openReviewModal(review);
  }

  function openReviewModal(review) {
    currentReview = review;
    document.getElementById('review-modal-title').textContent = review.title;
    const content = document.getElementById('review-modal-content');
    const parsed  = parseFindings(review.feedback);

    // Restore drafts before rendering, so findings show as queued straight away
    const restored = loadReviewQueue(review, parsed ? parsed.findings : []);
    queuedCommentsByKey = restored.drafts;
    ignoredKeys        = restored.ignored;
    sentState          = restored.sent;
    wasRegenerated     = restored.regenerated;
    orphanedPendingUrl = restored.orphanedPendingUrl;
    lastPartition   = null;
    queueResultHtml = "";
    findingsBeingEdited.clear();

    content.innerHTML = parsed
      ? renderMarkdown(parsed.before) + renderFindings(parsed.findings) + renderMarkdown(parsed.after)
      : `<div class="findings-notice">Couldn't read structured findings in this review — showing the raw text below.</div>`
        + renderMarkdown(review.feedback);
    // Render the verdict value as a colored chip, matching the card header
    content.querySelectorAll('h1, h2, h3').forEach((heading) => {
      const isVerdictHeading = /^(verdict|decision|recommendation)$/i.test(heading.textContent.trim());
      if (!isVerdictHeading) return;
      const valueElement = heading.nextElementSibling;
      const hasParagraphValue = valueElement && valueElement.tagName === 'P';
      if (hasParagraphValue) valueElement.innerHTML = verdictChip(valueElement.textContent.trim());
    });

    // Reset both panes to the top — the modal element is reused across reviews
    content.parentElement.scrollTop = 0;
    setDiffPaneHidden(true);
    renderQueueFooter();

    document.getElementById('review-modal').classList.add('visible');
    document.body.style.overflow = 'hidden';

    // The review text is already readable while the diff loads. Once it lands,
    // the footer can report which queued comments GitHub will accept inline.
    loadDiffPanel(review).then(() => refreshQueuePartition());
  }

  function closeReviewModal(e) {
    if (e && e.target !== document.getElementById('review-modal')) return;
    document.getElementById('review-modal').classList.remove('visible');
    document.body.style.overflow = '';
  }

  function renderMarkdown(raw) {
    // Escape HTML first to prevent XSS, then apply markdown on top
    const escaped = String(raw)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

    return escaped
      // Fenced code blocks (preserve content, undo escaping inside)
      .replace(/```([\w]*)?\n?([\s\S]*?)```/g, (_, lang, code) =>
        `<pre><code>${code.trim()}</code></pre>`)
      // Inline code
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      // Tables (must come before other block elements)
      .replace(/^\|(.+)\|$/gm, (row) => {
        const cells = row.split("|").slice(1, -1).map(c => c.trim());
        return "<tr>" + cells.map(cell =>
          /^[-:]+$/.test(cell) ? "" : `<td>${cell}</td>`
        ).filter(Boolean).join("") + "</tr>";
      })
      .replace(/(<tr>.*<\/tr>\n?)+/gs, (table) => {
        const rows = table.trim().split("\n");
        const header = rows[0].replace(/<td>/g, "<th>").replace(/<\/td>/g, "</th>");
        const body = rows.slice(2).join("\n");
        return `<table><thead>${header}</thead><tbody>${body}</tbody></table>`;
      })
      // Headings
      .replace(/^### (.+)$/gm, '<h3>$1</h3>')
      .replace(/^## (.+)$/gm, '<h2>$1</h2>')
      .replace(/^# (.+)$/gm, '<h1>$1</h1>')
      // Bold + italic
      .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
      // Bold
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      // Italic
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      // Horizontal rule
      .replace(/^---$/gm, '<hr>')
      // Unordered lists
      .replace(/((?:^[ \t]*[-*] .+\n?)+)/gm, (block) => {
        const items = block.trim().split("\n").map(line =>
          `<li>${line.replace(/^[ \t]*[-*] /, "")}</li>`
        ).join("");
        return `<ul>${items}</ul>`;
      })
      // Paragraphs
      .replace(/\n\n+/g, '</p><p>')
      .replace(/^(?!<[a-z])(.+)$/gm, (line) => line)
      .replace(/^(.+)$\n(?=<ul>|<pre>|<h[1-6]>|<hr>|<table>)/gm, '$1')
      // Wrap in paragraph tags if not already a block element
      .replace(/^(?!<(?:h[1-6]|ul|ol|li|pre|hr|table|thead|tbody|tr|th|td|p))(.+)$/gm, '<p>$1</p>');
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  async function openInClaude(btn) {
    const id = btn.getAttribute("data-id");
    const original = btn.textContent;

    if (MOCK_MODE) {
      // This one opens a real Terminal window, so there is nothing to preview
      showError("Mock mode: Claude Code needs the dashboard server running for real.");
      return;
    }

    btn.textContent = "Opening...";
    btn.disabled = true;
    try {
      const res = await fetch(`/api/open-in-claude/${encodeURIComponent(id)}`);
      if (!res.ok) {
        const data = await res.json();
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      btn.textContent = "✓ Opened";
      setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 2000);
    } catch (err) {
      btn.textContent = original;
      btn.disabled = false;
      showError(`Could not open in Claude Code: ${err.message}`);
    }
  }

  async function viewLog(btn) {
    const id    = btn.getAttribute("data-id");
    const title = btn.getAttribute("data-title");
    const modal = document.getElementById("log-modal");
    document.body.style.overflow = 'hidden';
    const content = document.getElementById("log-content");
    document.getElementById("log-modal-title").textContent = `Log — ${title}`;
    content.innerHTML = '<span class="log-loading">Loading log...</span>';
    modal.classList.add("visible");

    if (MOCK_MODE) {
      const review = reviews.find((entry) => entry.id === id);
      content.textContent = review ? mockLog(review) : "No log for this review.";
      return;
    }

    try {
      const res = await fetch(`/api/logs/${encodeURIComponent(id)}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      content.textContent = text;
    } catch (err) {
      content.innerHTML = `<span class="log-loading">Failed to load log: ${err.message}</span>`;
    }
  }

  async function dismissRerunFailure(button) {
    const reviewId = button.getAttribute("data-id");
    button.disabled = true;

    if (MOCK_MODE) {
      failedReruns.delete(reviewId);
      applyControls();
      return;
    }

    try {
      const response = await fetch(
        `/api/reviews/${encodeURIComponent(reviewId)}/dismiss-rerun-failure`,
        { method: "POST" }
      );
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      failedReruns.delete(reviewId);
      applyControls();
    } catch (err) {
      button.disabled = false;
      showError(`Could not dismiss the failure: ${err.message}`);
    }
  }

  function closeLogModal(e) {
    if (e && e.target !== document.getElementById("log-modal")) return;
    document.getElementById("log-modal").classList.remove("visible");
    document.body.style.overflow = '';
  }

  async function dismissReview(btn) {
    const id   = btn.getAttribute("data-id");
    const i    = btn.getAttribute("data-idx");
    const card = document.getElementById(`card-${i}`);
    card.classList.add("removing");

    if (MOCK_MODE) {
      // Gone until reload: mockReviews is the source, so there is nothing to delete
      reviews = reviews.filter(r => r.id !== id);
      setTimeout(() => { applyControls(); }, 220);
      return;
    }

    try {
      const res = await fetch(`/api/reviews/${encodeURIComponent(id)}`, { method: "DELETE" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      reviews = reviews.filter(r => r.id !== id);
      setTimeout(() => { applyControls(); }, 220);
    } catch (err) {
      card.classList.remove("removing");
      showError(`Could not dismiss review: ${err.message}`);
    }
  }

  function showError(msg) {
    const banner = document.getElementById("error-banner");
    banner.style.display = "";
    banner.textContent = msg;
    setTimeout(() => { banner.style.display = "none"; }, 5000);
  }

  let currentCommitsId = null;

  function closeCommitsModal() {
    document.getElementById('commits-modal').classList.remove('visible');
    document.body.style.overflow = '';
    currentCommitsId = null;
  }

  async function markSeenFromModal() {
    if (!currentCommitsId) return;
    const noteElement = document.getElementById("commits-rerun-note");

    if (MOCK_MODE) {
      // Clears the commits the same way the server would, so the state the
      // dismissal produces — chip back to its stored answer — is previewable
      const review = reviews.find((entry) => entry.id === currentCommitsId);
      if (review) {
        review.newCommits = [];
        review.commitsSeenSha = review.currentHeadSha ?? review.reviewedHeadSha ?? null;
      }
      closeCommitsModal();
      applyControls();
      return;
    }

    try {
      const response = await fetch(`/api/reviews/${encodeURIComponent(currentCommitsId)}/mark-seen`, { method: "POST" });

      // fetch resolves on 4xx and 5xx, so without this the modal would close and
      // the dashboard would reload as though the dismissal had been recorded
      if (!response.ok) {
        const payload = await response.json().catch(() => ({}));
        throw new Error(payload.error ?? `HTTP ${response.status}`);
      }

      closeCommitsModal();
      await loadReviews();
    } catch (err) {
      noteElement.innerHTML = `<div class="queue-error-box">Could not dismiss these commits: ${escHtml(err.message)}</div>`;
    }
  }

  function showCommitsFromBadge(badge) {
    const id      = badge.getAttribute('data-id');
    const commits = JSON.parse(badge.getAttribute('data-commits') || '[]');
    showCommits(id, commits);
  }

  function showCommits(id, commits) {
    currentCommitsId = id;
    document.body.style.overflow = 'hidden';
    document.getElementById('commits-modal-title').textContent =
      `${commits.length} new commit${commits.length !== 1 ? 's' : ''} since your last review`;
    // The sha links out, because deciding whether a re-run is warranted means
    // reading what actually landed. The repo comes from the review rather than
    // the id, since a mock id is not in owner/repo#number form. GitHub resolves
    // the 7-character sha we store.
    const review = reviews.find((entry) => entry.id === id);
    const repo = review?.repo ?? null;

    document.getElementById('commits-modal-body').innerHTML = commits.map((commit) => {
      const shaCell = repo
        ? `<a class="commit-sha" href="https://github.com/${escHtml(repo)}/commit/${escHtml(commit.sha)}"`
          + ` target="_blank" rel="noopener noreferrer" title="View this commit on GitHub">${escHtml(commit.sha)}</a>`
        : `<span class="commit-sha">${escHtml(commit.sha)}</span>`;
      return `
      <div class="commit-item">
        ${shaCell}
        <span class="commit-msg">${escHtml(commit.message)}</span>
        <span class="commit-author">${escHtml(commit.author)}</span>
      </div>
    `;
    }).join('');

  // Shaped like the real thing on purpose: one log per PR holding the whole
  // run in order, which is what View Log shows after the re-run redesign. The
  // variants are the three a reader actually has to tell apart — a clean run, a
  // run still going, and a run that died before the agent was reached.
  function mockLog(review) {
    const stamp = (minutesAgo) =>
      new Date(Date.now() - minutesAgo * 60000).toISOString();

    const startup = [
      `=== PR Review: https://github.com/${review.repo}/pull/${review.pull_number}`,
      `=== Started: ${stamp(12)}`,
      "",
      "🚀  PR Review Agent starting...",
      `📋  Log: logs/orchestration/${stamp(12).replace(/[:.]/g, "-").replace("T", "_").slice(0, 19)}.log`,
    ];

    // The case the red "Re-run failed" note points at: nothing reached the
    // agent, and this is where the reason lives
    const hasFailedRerun = rerunFailureFor(review.id) !== null;
    if (hasFailedRerun) {
      return [
        ...startup,
        "",
        "❌  Pre-flight failed: gh auth status check failed",
        "    gh: To get started with GitHub CLI, please run:  gh auth login",
        "    Re-authenticate, then run the review again.",
        "",
        `=== Run failed: ${stamp(9)} — exit code 1`,
      ].join("\n");
    }

    const reached = [
      ...startup,
      "✅  Pre-flight checks passed.",
      "📥  Fetching review skill from REVIEW_SKILL_URL ...",
      "    Loaded 18423 characters.",
      "👤  Authenticated as tcyph33",
      "",
      `📋  Reviewing ${review.repo}#${review.pull_number} only — skipping the tier search and the unchanged-head check.`,
      "    Tier: review-requested",
      "",
      `  🤖  Reviewing PR #${review.pull_number} in ${review.repo}: "${review.title}"`,
      "",
      `=== PR Review: https://github.com/${review.repo}/pull/${review.pull_number}`,
      `=== Agent started: ${stamp(10)}`,
      "",
    ];

    // claude --print returns nothing until it exits, so a live run's log really
    // does stop here
    const isRunning = isRerunning(review.id);
    if (isRunning) return reached.join("\n");

    const agentFailed = review.reviewStatus === "failed";
    if (agentFailed) {
      return [
        ...reached,
        `=== FAILED: ${stamp(8)}`,
        "Claude Code failed: API error 529 overloaded_error: the model is",
        "temporarily overloaded. Retried 3 times, then gave up.",
      ].join("\n");
    }

    return [
      ...reached,
      review.feedback,
      "",
      `=== Completed: ${stamp(6)}`,
      `  ✅  PR #${review.pull_number} review complete.`,
      "💾  Result saved.",
      "",
      `=== Run complete: ${stamp(6)}`,
    ].join("\n");
  }

  async function loadReviews(callRefresh = false) {
    if (MOCK_MODE) {
      const raw = mockReviews();
      reviews = [
        ...raw.filter(r => !r.prStatus || r.prStatus === "open"),
        ...raw.filter(r => r.prStatus && r.prStatus !== "open"),
      ];
      document.getElementById("loading-screen").style.display = "none";
      document.getElementById("summary-bar").style.display = "";
      document.getElementById("cards").style.display = "";
      firstLoad = false;
      populateRepoFilter();
      applyControls();
      document.getElementById("refreshed-at").textContent = "Mock data — design preview";
      return;
    }
    document.getElementById("error-banner").style.display = "none";
    if (callRefresh && firstLoad) {
      document.getElementById("loading-screen").style.display = "";
      document.getElementById("summary-bar").style.display = "none";
      document.getElementById("cards").style.display = "none";
      document.getElementById("controls-bar").style.display = "none";
    }
    if (callRefresh) {
      try { await fetch('/api/refresh', { method: 'POST' }); } catch { /* best effort */ }
    }
    try {
      const res = await fetch("/results/reviews.json?nocache=" + Date.now());
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const raw = await res.json();
      // open first, then merged/closed
      reviews = [
        ...raw.filter(r => !r.prStatus || r.prStatus === "open"),
        ...raw.filter(r => r.prStatus && r.prStatus !== "open"),
      ];
      if (firstLoad) {
        document.getElementById("loading-screen").style.display = "none";
        document.getElementById("summary-bar").style.display = "";
        document.getElementById("cards").style.display = "";
      }
      firstLoad = false;
      const scrollY = window.scrollY;
      populateRepoFilter();
      applyControls();
      window.scrollTo(0, scrollY);
      document.getElementById("refreshed-at").textContent =
        "Last refreshed: " + new Date().toLocaleTimeString();
    } catch (err) {
      showError(`Could not load reviews.json: ${err.message}. Make sure server.ts is running.`);
      document.getElementById("cards").innerHTML = "";
      document.getElementById("summary-bar").innerHTML = "";
    }
  }

  loadReviews(true);
  setInterval(() => loadReviews(true), 60000);
  // Far more often than the review refresh: this is what makes a run visible
  // while it happens, and it ticks the elapsed time on the card
  pollReruns();
  setInterval(pollReruns, 5000);
