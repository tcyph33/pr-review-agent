<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>PR Review Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #eef0f6;
      --panel: #ffffff;
      --panel-2: #f5f6fa;
      --line: #e6e8f0;
      --line-soft: #eef0f5;
      --accent: #6366f1;
      --accent-deep: #4f52d9;
      --accent-tint: #eef0fe;
      --ink: #1f2333;
      --ink-mute: #6b7088;
      --ink-faint: #9aa0b5;
      --good: #16a34a;
      --good-tint: #e8f7ee;
      --warn: #d97706;
      --warn-tint: #fdf3e3;
      --bad: #dc2626;
      --bad-tint: #fdeaea;
      --ink-body: #434965;
      --code-bg: #f7f8fb;
      --bad-border: #f3c6c6;
      --warn-border: #f0d9b5;
      --accent-border: #d8daf8;
      --accent-tint-hover: #e2e4fd;
      --bad-tint-hover: #fbdcdc;
      --overlay: rgba(31, 35, 51, 0.45);
      --mono: "SF Mono", "JetBrains Mono", "Fira Code", monospace;
      --shadow: 0 1px 2px rgba(31, 35, 51, 0.05), 0 8px 24px rgba(31, 35, 51, 0.07);
      --shadow-lift: 0 2px 4px rgba(31, 35, 51, 0.06), 0 14px 36px rgba(31, 35, 51, 0.12);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 28px 28px 48px;
    }

    header {
      background: var(--accent);
      border-radius: 16px;
      padding: 28px 32px;
      margin-bottom: 28px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .eyebrow {
      font-size: 0.64rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      line-height: 1.15;
    }

    h1 .accent { color: rgba(255, 255, 255, 0.65); font-weight: 500; }

    .meta { font-size: 0.72rem; color: rgba(255, 255, 255, 0.65); margin-top: 10px; font-family: var(--mono); }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 8px 16px;
      transition: background 0.15s, color 0.15s, border-color 0.15s, box-shadow 0.15s;
      font-family: inherit;
    }

    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary   { background: #ffffff; color: var(--accent-deep); }
    .btn-primary:hover { background: var(--accent-tint-hover); }
    .btn-danger    { background: rgba(255,255,255,0.12); color: #ffffff; border: 1px solid rgba(255,255,255,0.35); }
    .btn-danger:hover { background: rgba(255,255,255,0.22); }
    .btn-ghost     { background: var(--panel); color: var(--ink-mute); border: 1px solid var(--line); font-size: 0.72rem; padding: 6px 12px; }
    .btn-ghost:hover { color: var(--accent-deep); border-color: var(--accent); }
    .btn-claude    { background: var(--accent-tint); color: var(--accent-deep); border: 1px solid var(--accent-border); font-size: 0.7rem; padding: 4px 10px; }
    .btn-claude:hover { background: var(--accent-tint-hover); }
    .btn-log       { background: var(--panel); color: var(--ink-mute); border: 1px solid var(--line); font-size: 0.7rem; padding: 4px 10px; }
    .btn-log:hover { color: var(--warn); border-color: var(--warn-border); background: var(--warn-tint); }
    .btn-cancel    { background: var(--bad-tint); color: var(--bad); border: 1px solid var(--bad-border); font-size: 0.7rem; padding: 4px 10px; }
    .btn-cancel:hover { background: var(--bad-tint-hover); }

    .controls-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    .controls-bar select {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink-mute);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 6px 10px;
      cursor: pointer;
      outline: none;
      font-family: inherit;
      box-shadow: 0 1px 2px rgba(31,35,51,0.04);
    }

    .controls-bar select:hover { border-color: var(--accent); color: var(--ink); }

    .controls-label {
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--ink-faint);
      white-space: nowrap;
    }

    .controls-divider { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }

    .settings-wrap { position: relative; margin-left: auto; }

    .settings-gear {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink-mute);
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 2px rgba(31,35,51,0.04);
      transition: color 0.15s, border-color 0.15s, transform 0.25s ease;
    }

    .settings-gear:hover { color: var(--accent-deep); border-color: var(--accent); }
    .settings-gear.open { color: var(--accent-deep); border-color: var(--accent); transform: rotate(60deg); }

    .settings-dropdown {
      position: absolute;
      right: 0;
      top: calc(100% + 10px);
      width: 240px;
      background: var(--panel);
      border-radius: 12px;
      box-shadow: var(--shadow-lift);
      padding: 14px 16px;
      z-index: 50;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
    }

    .settings-dropdown.open { opacity: 1; visibility: visible; transform: translateY(0); }

    .settings-dropdown::before {
      content: "";
      position: absolute;
      top: -5px;
      right: 12px;
      width: 10px;
      height: 10px;
      background: var(--panel);
      transform: rotate(45deg);
      border-radius: 2px;
    }

    .settings-title {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--ink-faint);
      margin-bottom: 12px;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .settings-label { font-size: 0.8rem; font-weight: 500; color: var(--ink); }

    .settings-row select {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 5px 8px;
      cursor: pointer;
      outline: none;
      font-family: inherit;
    }

    .settings-row select:hover { border-color: var(--accent); }

    .pr-number { display: none; }

    .summary-bar {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .stat {
      background: var(--panel);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 18px 26px;
      min-width: 150px;
      flex: 1;
    }

    .stat-value { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); }
    .stat-label { font-size: 0.6rem; color: var(--ink-faint); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.16em; font-weight: 700; }
    .stat-warn .stat-value { color: var(--warn); }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(440px, 1fr));
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 520px) { .cards { grid-template-columns: 1fr; } }

    .card {
      background: var(--panel);
      border: 1px solid transparent;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      box-shadow: var(--shadow);
      transition: box-shadow 0.2s, border-color 0.15s, opacity 0.3s, transform 0.2s;
    }

    .card:hover { box-shadow: var(--shadow-lift); }
    .card.removing { opacity: 0; transform: scale(0.98); transition: opacity 0.2s, transform 0.2s; }
    .card-failed { border-color: var(--bad-border) !important; }
    .card-merged { opacity: 0.6; }
    .card-closed { opacity: 0.6; }

    .ghost-number {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--ink-faint);
      opacity: 0.7;
      user-select: none;
      font-family: var(--mono);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 22px 24px 16px;
      gap: 14px;
      position: relative;
    }

    .card-title-wrap { min-width: 0; flex: 1; padding-right: 56px; }

    .card-title { font-size: 1.02rem; font-weight: 650; color: var(--ink); text-decoration: none; line-height: 1.4; letter-spacing: -0.01em; }
    .card-title:hover { color: var(--accent-deep); }
    .card-title-failed { color: var(--bad); }

    .card-meta { display: flex; flex-direction: column; align-items: flex-start; gap: 7px; margin-top: 11px; }

    /* The one chip answering "what now". The left bar gives it weight without
       needing a heavier fill than the quieter facts beneath it. */
    .action-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 4px 11px;
      border-radius: 6px;
      border-left: 3px solid currentColor;
      white-space: nowrap;
    }

    .action-bad    { background: var(--bad-tint);    color: var(--bad); }
    .action-warn   { background: var(--warn-tint);   color: var(--warn); }
    .action-accent { background: var(--accent-tint); color: var(--accent-deep); }
    .action-good   { background: var(--good-tint);   color: var(--good); }
    .action-mute   { background: var(--panel-2);     color: var(--ink-mute); }

    .action-chip-link { cursor: pointer; }
    .action-chip-link:hover { text-decoration: underline; }

    /* A failed re-run is a passing fact about an attempt, not a state of the
       review, so it reads as a small note under the facts rather than taking
       over the chip — the status above it is still true. */
    .rerun-failed-note {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      font-size: 0.72rem;
      color: var(--bad);
    }
    .rerun-failed-x {
      background: transparent;
      border: none;
      color: var(--bad);
      opacity: 0.65;
      font-size: 0.78rem;
      line-height: 1;
      padding: 0 2px;
      cursor: pointer;
    }
    .rerun-failed-x:hover { opacity: 1; }

    /* A live run reads as live at a glance, without needing the label read */
    .action-live { animation: chip-pulse 1.8s ease-in-out infinite; }
    @keyframes chip-pulse { 50% { opacity: 0.55; } }
    @media (prefers-reduced-motion: reduce) {
      .action-live { animation: none; }
    }

    .card-facts { font-size: 0.72rem; color: var(--ink-faint); line-height: 1.5; }
    .fact-link  { color: var(--accent-deep); cursor: pointer; }
    .fact-link:hover { text-decoration: underline; }

    .badge {
      font-size: 0.66rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--panel-2);
      color: var(--ink-mute);
      display: inline-flex;
      align-items: center;
    }

    .badge-failed { background: var(--bad-tint); color: var(--bad); }
    .badge-waiting-medium { background: var(--warn-tint); color: var(--warn); }
    .badge-waiting-high { background: var(--bad-tint); color: var(--bad); }
    .badge-commits { background: var(--accent-tint); color: var(--accent-deep); cursor: pointer; }
    .badge-commits:hover { background: var(--accent-tint-hover); }
    .badge-state-pending { background: var(--panel-2); color: var(--ink-mute); }
    .badge-state-commented { background: var(--accent-tint); color: var(--accent-deep); }
    .badge-state-changes { background: var(--warn-tint); color: var(--warn); }
    .badge-state-approved { background: var(--good-tint); color: var(--good); }
    .badge-status-open { display: none; }
    .badge-status-merged { background: var(--accent-tint); color: var(--accent-deep); }
    .badge-status-closed { background: var(--panel-2); color: var(--ink-faint); }

    .meta-line {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--ink-faint);
      margin-top: 8px;
      word-break: break-word;
    }

    .diff-add { color: var(--good); }
    .diff-del { color: var(--bad); }

    .title-arrow {
      font-size: 0.8em;
      color: var(--ink-faint);
      opacity: 0;
      transition: opacity 0.15s;
    }

    .card:hover .title-arrow { opacity: 1; }

    .card-top-right {
      position: absolute;
      top: 14px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 2;
    }

    .card-x {
      background: transparent;
      border: none;
      color: var(--ink-faint);
      font-size: 0.85rem;
      line-height: 1;
      padding: 4px 6px;
      border-radius: 6px;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s, background 0.15s;
    }

    .card:hover .card-x { opacity: 1; }
    .card-x:hover { color: var(--bad); background: var(--bad-tint); }

    .card-body { border-top: 1px solid var(--line-soft); padding: 16px 24px; }

    .failed-message { font-size: 0.85rem; color: var(--ink-mute); font-style: italic; }

    .feedback-preview { cursor: pointer; }
    .feedback-preview:hover .feedback-click-hint { color: var(--accent-deep); }

    .feedback-section { margin-bottom: 12px; }
    .feedback-section-body {
      font-size: 0.85rem;
      line-height: 1.65;
      color: var(--ink-body);
      word-break: break-word;
    }

    .feedback-section-body p { margin: 0 0 6px; }
    .feedback-section-body p:last-child { margin-bottom: 0; }
    .feedback-section-body strong { color: var(--ink); font-weight: 650; }
    .feedback-section-body em { font-style: italic; }
    .feedback-section-body code { background: var(--panel-2); color: var(--accent-deep); padding: 1px 5px; border-radius: 4px; font-family: var(--mono); font-size: 0.76rem; }
    .feedback-section-body ul, .feedback-section-body ol { padding-left: 20px; margin: 4px 0; }
    .feedback-section-body li { margin: 3px 0; }

    .verdict-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.66rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 4px 12px;
      border-radius: 20px;
      background: var(--panel-2);
      flex-shrink: 0;
    }

    .verdict-approve { background: var(--good-tint); color: var(--good); }
    .verdict-changes { background: var(--warn-tint); color: var(--warn); }
    .verdict-reject { background: var(--bad-tint); color: var(--bad); }
    .verdict-neutral { color: var(--ink-mute); }

    /* ── Structured findings ── */
    .findings { display: flex; flex-direction: column; gap: 12px; margin: 10px 0 18px; }

    .finding {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
    }

    .finding-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }

    .sev-blocker { background: var(--bad-tint);  color: var(--bad); }
    .sev-warning { background: var(--warn-tint); color: var(--warn); }
    .sev-nit     { background: var(--panel);     color: var(--ink-mute); }

    .finding-loc { font-family: var(--mono); font-size: 0.76rem; font-weight: 600; color: var(--ink); word-break: break-all; }

    .finding-scope {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      font-size: 0.58rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--ink-faint);
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 1px 6px;
      margin-left: 7px;
      white-space: nowrap;
    }

    .finding-check { margin-left: auto; font-family: var(--mono); font-size: 0.66rem; color: var(--ink-faint); flex-shrink: 0; }

    .finding-title { font-size: 0.9rem; font-weight: 650; color: var(--ink); line-height: 1.45; margin-bottom: 6px; }

    .finding-detail { font-size: 0.83rem; line-height: 1.65; color: var(--ink-body); }
    .finding-detail p { margin: 0 0 6px; }
    .finding-detail p:last-child { margin-bottom: 0; }
    .finding-detail code { background: var(--panel); color: var(--accent-deep); padding: 1px 5px; border-radius: 4px; font-family: var(--mono); font-size: 0.75rem; }

    .finding-refs {
      margin-top: 11px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }

    .finding-refs-label { font-size: 0.58rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-faint); }
    .finding-ref { font-family: var(--mono); font-size: 0.72rem; color: var(--ink-mute); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }

    .findings-empty { font-size: 0.85rem; color: var(--ink-mute); font-style: italic; padding: 8px 0 14px; }

    .findings-notice {
      background: var(--warn-tint);
      border: 1px solid var(--warn-border);
      color: var(--warn);
      border-radius: 8px;
      padding: 10px 13px;
      font-size: 0.78rem;
      margin-bottom: 14px;
    }

    /* Severity rollup on the card preview */
    .finding-rollup { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 11px; }
    .roll { font-size: 0.63rem; font-weight: 700; padding: 3px 9px; border-radius: 20px; }
    .roll-blocker { background: var(--bad-tint);  color: var(--bad); }
    .roll-warning { background: var(--warn-tint); color: var(--warn); }
    .roll-nit     { background: var(--panel-2);   color: var(--ink-mute); }
    .roll-clean   { background: var(--good-tint); color: var(--good); }

    /* ── Review modal: review text beside the PR diff ── */
    .modal-wide { max-width: 1400px; }

    .modal-header-actions { display: flex; align-items: center; gap: 10px; }

    .modal-split { display: flex; flex: 1; min-height: 0; }

    .modal-pane { overflow-y: auto; padding: 18px 22px; }
    .modal-pane-review { flex: 0 0 46%; min-width: 0; }

    .modal-pane-diff {
      flex: 1;
      min-width: 0;
      border-left: 1px solid var(--line-soft);
      background: var(--panel-2);
      /* Long lines scroll inside each file's diff, not by dragging the pane */
      overflow-x: hidden;
    }

    .modal-split.diff-hidden .modal-pane-diff { display: none; }
    .modal-split.diff-hidden .modal-pane-review { flex: 1; }

    @media (max-width: 1100px) {
      .modal-split { flex-direction: column; }
      .modal-pane-review { flex: none; }
      .modal-pane-diff { border-left: none; border-top: 1px solid var(--line-soft); }
    }

    /* ── Files-changed panel ── */
    .diff-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .diff-head-title { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-faint); }
    .diff-head-stats { font-family: var(--mono); font-size: 0.72rem; color: var(--ink-mute); }

    .diff-note { font-size: 0.78rem; color: var(--ink-mute); font-style: italic; padding: 8px 0 12px; }

    .diff-truncated {
      background: var(--warn-tint);
      border: 1px solid var(--warn-border);
      color: var(--warn);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.74rem;
      margin-bottom: 10px;
    }

    .diff-file { border: 1px solid var(--line); border-radius: 9px; background: var(--panel); margin-bottom: 8px; overflow: hidden; }

    .diff-file-row { display: flex; align-items: center; gap: 9px; padding: 8px 11px; cursor: pointer; }
    .diff-file-row:hover { background: var(--panel-2); }

    .diff-caret { color: var(--ink-faint); font-size: 0.7rem; flex-shrink: 0; transition: transform 0.15s; }
    .diff-file.open .diff-caret { transform: rotate(90deg); }

    .diff-status { font-family: var(--mono); font-size: 0.68rem; font-weight: 700; width: 13px; text-align: center; flex-shrink: 0; }
    .diff-status-added    { color: var(--good); }
    .diff-status-removed  { color: var(--bad); }
    .diff-status-modified { color: var(--warn); }
    .diff-status-renamed  { color: var(--accent-deep); }
    .diff-status-copied   { color: var(--accent-deep); }

    .diff-name   { font-family: var(--mono); font-size: 0.73rem; color: var(--ink); flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .diff-counts { font-family: var(--mono); font-size: 0.68rem; flex-shrink: 0; white-space: nowrap; }

    .diff-body { display: none; border-top: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; }
    .diff-file.open .diff-body { display: block; }

    /* max-content so a long line actually overflows and produces a scrollbar;
       min-width so a short diff still fills the panel rather than shrinking. */
    .diff-table {
      border-collapse: collapse;
      width: max-content;
      min-width: 100%;
      font-family: var(--mono);
      font-size: 0.7rem;
      line-height: 1.55;
    }

    /* macOS hides overlay scrollbars until something scrolls, which leaves no
       hint that a diff line continues past the edge. Keep this one visible. */
    .diff-body::-webkit-scrollbar { height: 11px; }
    .diff-body::-webkit-scrollbar-track { background: var(--panel-2); }
    .diff-body::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 6px;
      border: 2px solid var(--panel-2);
    }
    .diff-body::-webkit-scrollbar-thumb:hover { background: var(--ink-faint); }

    .diff-ln {
      white-space: nowrap;
      text-align: right;
      padding: 0 7px;
      color: var(--ink-faint);
      user-select: none;
      border-right: 1px solid var(--line);
      vertical-align: top;
    }
    .diff-code { padding: 0 10px; white-space: pre; color: var(--ink-body); }
    .diff-row-add .diff-code { background: var(--good-tint); }
    .diff-row-del .diff-code { background: var(--bad-tint); }
    .diff-row-hunk td { background: var(--panel-2); color: var(--ink-faint); padding: 3px 10px; font-size: 0.68rem; }
    .diff-row-meta .diff-code { color: var(--ink-faint); font-style: italic; }

    .diff-nopatch { padding: 10px 12px; font-size: 0.74rem; color: var(--ink-mute); font-style: italic; }

    /* The row a finding points at, highlighted additively so it reads on top of
       the add/delete tints rather than replacing them. */
    .diff-row-target .diff-code { box-shadow: inset 3px 0 0 var(--accent); font-weight: 600; }

    /* ── Jump from a finding into the diff ── */
    .finding-loc-link { cursor: pointer; }
    .finding-loc-link:hover { color: var(--accent-deep); text-decoration: underline; }
    .finding-jump { font-size: 0.74em; color: var(--ink-faint); margin-left: 3px; }
    .finding-loc-link:hover .finding-jump { color: var(--accent-deep); }

    /* ── Per-finding comment queue ── */
    .finding-queue { margin-top: 11px; padding-top: 10px; border-top: 1px solid var(--line); }

    /* An ignored finding is dimmed the same amount as a queued one, but keeps its
       title un-struck and takes a dashed border. Queued and ignored are opposite
       decisions — "will be sent" against "deliberately not sent" — so they must
       not read the same while scrolling a long list. */
    .finding.ignored { border-style: dashed; }
    .finding.ignored .finding-head,
    .finding.ignored .finding-title,
    .finding.ignored .finding-detail,
    .finding.ignored .finding-refs { opacity: 0.45; }

    .queue-label-ignored { color: var(--ink-mute); }
    .queue-ignored-text { font-size: 0.78rem; color: var(--ink-mute); font-style: italic; margin-top: 4px; }
    .queue-ignored-note { font-size: 0.74rem; color: var(--warn); margin-top: 6px; }

    /* A queued finding is dimmed and struck through to mark it handled, but the
       queue controls stay at full contrast so the drafted comment stays readable. */
    .finding.queued .finding-head,
    .finding.queued .finding-title,
    .finding.queued .finding-detail,
    .finding.queued .finding-refs { opacity: 0.45; }
    .finding.queued .finding-title { text-decoration: line-through; }

    .btn-queue {
      background: var(--accent-tint);
      color: var(--accent-deep);
      border: 1px solid var(--accent-border);
      font-size: 0.68rem;
      padding: 4px 11px;
    }
    .btn-queue:hover { background: var(--accent-tint-hover); }

    .btn-queue-remove {
      background: var(--panel);
      color: var(--ink-mute);
      border: 1px solid var(--line);
      font-size: 0.68rem;
      padding: 4px 11px;
    }
    .btn-queue-remove:hover { color: var(--bad); border-color: var(--bad-border); background: var(--bad-tint); }

    .queue-actions { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }

    .queue-editor textarea {
      width: 100%;
      min-height: 86px;
      resize: vertical;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 11px;
      font-family: inherit;
      font-size: 0.82rem;
      line-height: 1.6;
      color: var(--ink);
      outline: none;
    }

    .queue-editor textarea:focus { border-color: var(--accent); }
    .queue-editor-actions { display: flex; gap: 7px; margin-top: 8px; align-items: center; }

    .queue-error { font-size: 0.72rem; color: var(--bad); }

    .queue-label {
      font-size: 0.58rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--good);
    }

    .queue-preview {
      margin-top: 7px;
      font-size: 0.8rem;
      line-height: 1.6;
      color: var(--ink-body);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 11px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ── Review modal footer ── */
    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 22px;
      border-top: 1px solid var(--line-soft);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .modal-footer { flex-direction: column; align-items: stretch; }

    .queue-footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .queue-count { font-size: 0.8rem; font-weight: 600; color: var(--ink); }

    .btn-link { text-decoration: none; display: inline-flex; align-items: center; }

    .queue-notice {
      background: var(--warn-tint);
      border: 1px solid var(--warn-border);
      color: var(--warn);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.76rem;
      margin-bottom: 11px;
    }

    .queue-unplaceable { margin-top: 11px; border-top: 1px solid var(--line); padding-top: 10px; }

    .queue-unplaceable-title {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.13em;
      color: var(--warn);
      margin-bottom: 8px;
    }

    .queue-unplaceable-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 4px 0;
      flex-wrap: wrap;
    }

    .queue-unplaceable-where  { font-family: var(--mono); font-size: 0.72rem; color: var(--ink); }
    .queue-unplaceable-reason { font-size: 0.74rem; color: var(--ink-mute); flex: 1; min-width: 160px; }

    .queue-working, .queue-success, .queue-error-box, .queue-info {
      margin-top: 11px;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.78rem;
      line-height: 1.55;
    }

    .queue-working   { background: var(--panel-2);  color: var(--ink-mute); font-style: italic; }
    .queue-success   { background: var(--good-tint); color: var(--good); border: 1px solid var(--good); }
    .queue-error-box { background: var(--bad-tint);  color: var(--bad);  border: 1px solid var(--bad-border); }
    .queue-info      { background: var(--panel-2);  color: var(--ink-body); border: 1px solid var(--line); }

    .queue-error-detail { font-family: var(--mono); font-size: 0.72rem; margin-top: 6px; opacity: 0.85; }

    .queue-success a, .queue-error-box a, .queue-info a { color: inherit; font-weight: 600; }

    .read-more {
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--ink-faint);
      cursor: pointer;
      transition: color 0.15s;
      white-space: nowrap;
    }

    .read-more:hover { color: var(--accent-deep); }

    /* Commit modal */
    .commits-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--overlay);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .commits-modal-overlay.visible { display: flex; }

    .commits-modal {
      background: var(--panel);
      border-radius: 16px;
      box-shadow: var(--shadow-lift);
      width: 100%;
      max-width: 540px;
      max-height: 70vh;
      display: flex;
      flex-direction: column;
    }

    .commits-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line-soft);
      flex-shrink: 0;
    }

    .commits-modal-title { font-size: 0.88rem; font-weight: 650; color: var(--ink); }
    .commits-modal-close { background: transparent; border: none; color: var(--ink-faint); font-size: 1.2rem; cursor: pointer; padding: 0 4px; line-height: 1; }
    .commits-modal-close:hover { color: var(--ink); }

    .commits-modal-body { overflow-y: auto; flex: 1; padding: 8px 0; }

    .commit-item {
      padding: 8px 20px;
      font-size: 0.78rem;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .commit-item:hover { background: var(--panel-2); }
    .commit-sha    { color: var(--accent-deep); font-family: var(--mono); flex-shrink: 0; }
    a.commit-sha        { text-decoration: none; }
    a.commit-sha:hover  { text-decoration: underline; }
    .commit-msg    { color: var(--ink-body); flex: 1; word-break: break-word; }
    .commit-author { color: var(--ink-faint); font-size: 0.7rem; flex-shrink: 0; }

    .commits-modal-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--line-soft);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
      flex-shrink: 0;
    }

    .commits-footer-actions { justify-content: flex-end; }

    /* Full review modal markdown */
    .review-md { font-size: 0.86rem; line-height: 1.7; color: var(--ink-body); }
    .review-md h1 { font-size: 1rem; font-weight: 700; color: var(--ink); margin: 16px 0 6px; letter-spacing: -0.01em; }
    .review-md h2 { font-size: 0.74rem; font-weight: 700; color: var(--accent-deep); margin: 18px 0 6px; text-transform: uppercase; letter-spacing: 0.14em; }
    .review-md h3 { font-size: 0.85rem; font-weight: 650; color: var(--ink); margin: 12px 0 4px; }
    .review-md strong { color: var(--ink); font-weight: 650; }
    .review-md em { font-style: italic; }
    .review-md code { background: var(--panel-2); color: var(--accent-deep); padding: 1px 5px; border-radius: 4px; font-family: var(--mono); font-size: 0.76rem; }
    .review-md pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 8px 0; overflow-x: auto; }
    .review-md pre code { background: transparent; color: var(--ink-body); padding: 0; font-size: 0.74rem; }
    .review-md ul, .review-md ol { padding-left: 20px; margin: 6px 0; }
    .review-md li { margin: 3px 0; }
    .review-md hr { border: none; border-top: 1px solid var(--line); margin: 12px 0; }
    .review-md p { margin: 6px 0; }
    .review-md table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 0.78rem; }
    .review-md th { background: var(--panel-2); color: var(--ink); padding: 6px 10px; text-align: left; border: 1px solid var(--line); font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.1em; }
    .review-md td { padding: 5px 10px; border: 1px solid var(--line); color: var(--ink-body); }
    .review-md tr:nth-child(even) td { background: var(--code-bg); }

    .card-footer { padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--line-soft); }
    .footer-actions { display: flex; gap: 6px; flex-wrap: wrap; }

    .empty { text-align: center; padding: 80px 24px; color: var(--ink-mute); grid-column: 1 / -1; }
    .empty h2 { font-size: 1.1rem; margin-bottom: 8px; color: var(--ink); }
    .empty p  { font-size: 0.85rem; }
    .empty code { background: var(--panel-2); color: var(--accent-deep); padding: 1px 6px; border-radius: 4px; font-family: var(--mono); font-size: 0.8rem; }

    .error-banner {
      background: var(--bad-tint);
      border: 1px solid var(--bad-border);
      border-radius: 12px;
      padding: 14px 18px;
      color: var(--bad);
      font-size: 0.85rem;
      margin-bottom: 24px;
      display: none;
    }

    /* ── Log + review modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--overlay);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .modal-overlay.visible { display: flex; }

    .modal {
      background: var(--panel);
      border-radius: 16px;
      box-shadow: var(--shadow-lift);
      width: 100%;
      max-width: 860px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line-soft);
    }

    .modal-title { font-size: 0.92rem; font-weight: 650; color: var(--ink); letter-spacing: -0.01em; }
    .modal-close { background: transparent; border: none; color: var(--ink-faint); font-size: 1.2rem; cursor: pointer; padding: 0 4px; }
    .modal-close:hover { color: var(--ink); }

    .modal-body { padding: 18px 22px; overflow-y: auto; flex: 1; }

    .log-content {
      font-family: var(--mono);
      font-size: 0.76rem;
      line-height: 1.6;
      color: var(--ink-body);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .log-loading { color: var(--ink-mute); font-style: italic; font-size: 0.85rem; }

    /* Dark theme: applies when system prefers dark (unless pinned to light),
       or when explicitly pinned to dark via the header toggle. */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e0e14;
        --panel: #15151e;
        --panel-2: #1e1e2a;
        --line: #26263a;
        --line-soft: #1e1e2e;
        --accent: #5558e6;
        --accent-deep: #9a9aff;
        --accent-tint: #1e1e36;
        --ink: #e9e9f2;
        --ink-mute: #9494ab;
        --ink-faint: #62627a;
        --good: #4ade80;
        --good-tint: #142a1c;
        --warn: #fbbf24;
        --warn-tint: #2a2210;
        --bad: #f87171;
        --bad-tint: #2c1518;
        --ink-body: #c2c2d4;
        --code-bg: #101018;
        --bad-border: #4a2430;
        --warn-border: #4a3a1a;
        --accent-border: #3a3a6e;
        --accent-tint-hover: #26264a;
        --bad-tint-hover: #3a1a22;
        --overlay: rgba(6, 6, 12, 0.7);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
        --shadow-lift: 0 2px 4px rgba(0, 0, 0, 0.35), 0 14px 36px rgba(0, 0, 0, 0.5);
      }

      :root:not([data-theme="light"]) .btn-primary { background: #ffffff; color: #4f52d9; }
      :root:not([data-theme="light"]) .btn-primary:hover { background: #e2e4fd; }
    }

    :root[data-theme="dark"] {
        --bg: #0e0e14;
        --panel: #15151e;
        --panel-2: #1e1e2a;
        --line: #26263a;
        --line-soft: #1e1e2e;
        --accent: #5558e6;
        --accent-deep: #9a9aff;
        --accent-tint: #1e1e36;
        --ink: #e9e9f2;
        --ink-mute: #9494ab;
        --ink-faint: #62627a;
        --good: #4ade80;
        --good-tint: #142a1c;
        --warn: #fbbf24;
        --warn-tint: #2a2210;
        --bad: #f87171;
        --bad-tint: #2c1518;
        --ink-body: #c2c2d4;
        --code-bg: #101018;
        --bad-border: #4a2430;
        --warn-border: #4a3a1a;
        --accent-border: #3a3a6e;
        --accent-tint-hover: #26264a;
        --bad-tint-hover: #3a1a22;
        --overlay: rgba(6, 6, 12, 0.7);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
        --shadow-lift: 0 2px 4px rgba(0, 0, 0, 0.35), 0 14px 36px rgba(0, 0, 0, 0.5);
    }

    :root[data-theme="dark"] .btn-primary { background: #ffffff; color: #4f52d9; }
    :root[data-theme="dark"] .btn-primary:hover { background: #e2e4fd; }
  </style>
</head>
<body>

<header>
  <div>
    <div class="eyebrow">Automated Agent · Pull Requests</div>
    <h1>Code reviews, <span class="accent">handled.</span></h1>
    <div class="meta" id="refreshed-at"></div>
  </div>
  <div class="actions">
  </div>
</header>

<div class="error-banner" id="error-banner"></div>


<div id="loading-screen" style="text-align:center;padding:80px 24px;color:#8b949e;">
  <div style="font-size:1.1rem;color:#c9d1d9;margin-bottom:8px;">Loading reviews...</div>
  <div style="font-size:0.85rem;">Fetching latest status from GitHub</div>
</div>
<div class="summary-bar" id="summary-bar" style="display:none"></div>

<div class="controls-bar" id="controls-bar" style="display:none">
  <span class="controls-label">Sort:</span>
  <select id="sort-select" onchange="applyControls()">
    <option value="attention">Needs attention first</option>
    <option value="reviewed-desc">Recently reviewed</option>
    <option value="age-desc">Oldest PR first</option>
    <option value="age-asc">Newest PR first</option>
    <option value="repo-asc">Repo (A–Z)</option>
    <option value="waiting-desc">Waiting longest</option>
    <option value="waiting-asc">Waiting shortest</option>
  </select>
  <div class="controls-divider"></div>
  <span class="controls-label">Repo:</span>
  <select id="filter-repo" onchange="applyControls()">
    <option value="all">All repos</option>
  </select>
  <span class="controls-label">Action:</span>
  <select id="filter-action" onchange="applyControls()">
    <option value="all">All actions</option>
    <option value="running">Agent running</option>
    <option value="needs-review">Needs your review</option>
    <option value="rerun">Agent re-run needed</option>
    <option value="waiting-author">Waiting on author</option>
    <option value="approved">Approved</option>
    <option value="failed">Review failed</option>
    <option value="merged">Merged</option>
    <option value="closed">Closed</option>
  </select>
  <div class="settings-wrap">
    <button class="settings-gear" id="settings-gear" onclick="toggleSettings(event)" title="Settings" aria-label="Settings" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
    <div class="settings-dropdown" id="settings-dropdown">
      <div class="settings-title">Settings</div>
      <div class="settings-row">
        <label class="settings-label" for="theme-select">Theme</label>
        <select id="theme-select" onchange="setTheme(this.value)">
          <option value="auto">Auto (system)</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
    </div>
  </div>
</div>

<div class="cards" id="cards" style="display:none"></div>

<!-- Log modal -->
<div class="modal-overlay" id="log-modal" onclick="closeLogModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="log-modal-title">Agent Log</div>
      <button class="modal-close" onclick="closeLogModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="log-content" id="log-content"></div>
    </div>
  </div>
</div>

<!-- Full review modal -->
<div class="modal-overlay" id="review-modal" onclick="closeReviewModal(event)">
  <div class="modal modal-wide">
    <div class="modal-header">
      <div class="modal-title" id="review-modal-title">Full Review</div>
      <div class="modal-header-actions">
        <button class="btn-ghost" id="diff-toggle-btn" onclick="toggleDiffPane()">Hide diff</button>
        <button class="modal-close" onclick="closeReviewModal()">✕</button>
      </div>
    </div>
    <div class="modal-split" id="modal-split">
      <div class="modal-pane modal-pane-review">
        <div class="review-md" id="review-modal-content"></div>
      </div>
      <div class="modal-pane modal-pane-diff">
        <div id="diff-panel"></div>
      </div>
    </div>
    <div class="modal-footer" id="review-modal-footer" style="display:none"></div>
  </div>
</div>

<!-- Commits modal -->
<div class="commits-modal-overlay" id="commits-modal">
  <div class="commits-modal">
    <div class="commits-modal-header">
      <div class="commits-modal-title" id="commits-modal-title">New Commits</div>
      <button class="commits-modal-close" onclick="closeCommitsModal()">✕</button>
    </div>
    <div class="commits-modal-body" id="commits-modal-body"></div>
    <div class="commits-modal-footer">
      <div id="commits-rerun-note"></div>
      <div class="queue-actions commits-footer-actions">
        <button class="btn-ghost" onclick="closeCommitsModal()">Close</button>
        <button class="btn-ghost" id="commits-mark-seen-btn" onclick="markSeenFromModal()">No re-run needed</button>
        <button class="btn-queue" onclick="rerunFromCommitsModal()">Re-run the agent</button>
      </div>
    </div>
  </div>
</div>

<script>
  let reviews = [];

  // ── Theme: "auto" follows system; "light"/"dark" pin it ──
  function applyTheme(theme) {
    if (theme === "light" || theme === "dark") {
      document.documentElement.dataset.theme = theme;
    } else {
      delete document.documentElement.dataset.theme;
    }
    const select = document.getElementById("theme-select");
    if (select) select.value = theme;
  }

  function setTheme(theme) {
    if (theme === "auto") localStorage.removeItem("theme");
    else localStorage.setItem("theme", theme);
    applyTheme(theme);
  }

  applyTheme(localStorage.getItem("theme") || "auto");

  // ── Settings dropdown ──
  function toggleSettings(e) {
    e.stopPropagation();
    const dropdown = document.getElementById("settings-dropdown");
    const gear = document.getElementById("settings-gear");
    const open = dropdown.classList.toggle("open");
    gear.classList.toggle("open", open);
    gear.setAttribute("aria-expanded", String(open));
  }

  function closeSettings() {
    document.getElementById("settings-dropdown").classList.remove("open");
    const gear = document.getElementById("settings-gear");
    gear.classList.remove("open");
    gear.setAttribute("aria-expanded", "false");
  }

  document.addEventListener("click", (e) => {
    const wrap = e.target.closest(".settings-wrap");
    if (!wrap) closeSettings();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeSettings();
  });

  function timeAgo(isoString) {
    const diff = Date.now() - new Date(isoString).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1)  return "just now";
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24)  return `${hrs}h ago`;
    return `${Math.floor(hrs / 24)}d ago`;
  }

  function prAgeDays(r) {
    const created = r.prCreatedAt ? new Date(r.prCreatedAt) : new Date(r.reviewedAt);
    return Math.floor((Date.now() - created.getTime()) / 86400000);
  }

  function waitingDays(r) {
    if (!r.reviewRequestedAt) return null;
    return Math.floor((Date.now() - new Date(r.reviewRequestedAt).getTime()) / 86400000);
  }

  // ── What to do with each PR ──
  // One state per review, answering "what now" rather than reporting raw GitHub
  // fields. `order` drives the attention sort; lower means more urgent.
  const REVIEW_ACTIONS = {
    running:          { label: "Agent running",       tone: "accent", order: 0 },
    failed:           { label: "Review failed",       tone: "bad",    order: 1 },
    rerun:            { label: "Agent re-run needed", tone: "warn",   order: 2 },
    "needs-review":   { label: "Needs your review",   tone: "accent", order: 3 },
    "waiting-author": { label: "Waiting on author",   tone: "mute",   order: 4 },
    approved:         { label: "Approved",            tone: "good",   order: 5 },
    merged:           { label: "Merged",              tone: "mute",   order: 6 },
    closed:           { label: "Closed",              tone: "mute",   order: 7 },
  };

  const REVIEW_STATE_TEXT = {
    PENDING:           "no feedback from you yet",
    COMMENTED:         "you commented",
    CHANGES_REQUESTED:  "you requested changes",
    APPROVED:          "you approved",
    DISMISSED:         "your review was dismissed",
  };

  function deriveReviewAction(review, isRunning = false) {
    // A live agent run outranks every stored fact: whatever the record says now
    // is about to be replaced, so the only sensible move is to wait or cancel.
    // Passed in rather than read from module state so this stays a pure
    // function of its arguments.
    if (isRunning) return "running";

    // A finished PR outranks everything else, including a failed agent run:
    // there is nothing left to act on either way.
    if (review.prStatus === "merged") return "merged";
    if (review.prStatus === "closed") return "closed";

    const hasFailed = review.reviewStatus === "failed";
    if (hasFailed) return "failed";

    // A moved head means the findings describe older code, so re-running the
    // agent comes before writing another round of feedback against them.
    const dismissedSha  = review.commitsSeenSha ?? review.reviewedHeadSha ?? null;
    const canCompare    = Boolean(review.currentHeadSha) && Boolean(dismissedSha);
    const isOutOfDate   = canCompare && review.currentHeadSha !== dismissedSha;
    if (isOutOfDate) return "rerun";

    // Checked before the author's pushes, which matches GitHub: an approval
    // survives new commits unless the repo dismisses stale approvals, and while
    // it stands the PR is mergeable and nothing is needed from you. On a repo
    // that does dismiss, GitHub moves the review to DISMISSED and the branch
    // below picks it up instead.
    const isApproved = review.reviewState === "APPROVED";
    if (isApproved) return "approved";

    // GitHub threw the approval out because the author pushed, so GitHub is
    // waiting on you again. Without this the PR read as "waiting on author"
    // indefinitely — a stalemate nothing but a visit to GitHub would reveal.
    const wasDismissed = review.reviewState === "DISMISSED";
    if (wasDismissed) return "needs-review";

    // Either you have never given feedback, or the author has pushed since you
    // did. Read from lastAuthorPushAt rather than the newCommits list because
    // dismissing that list is a judgment about re-running the agent, and it
    // must not also decide whose turn it is. Merges from the base branch are
    // already excluded upstream, so they never put the turn back on you.
    const hasSubmitted = Boolean(review.lastReviewSubmittedAt);
    const pushedAt = review.lastAuthorPushAt ?? null;
    const hasRespondedSince = Boolean(pushedAt)
      && pushedAt > review.lastReviewSubmittedAt;
    const needsReview = !hasSubmitted || hasRespondedSince;
    if (needsReview) return "needs-review";

    return "waiting-author";
  }

  // ── Live agent runs ──
  // Review id → ISO start time, for every re-run the server has in progress.
  // Held separately from `reviews` because it is polled far more often: the
  // review records refresh once a minute, which would make a run look finished
  // long before it is, or still running long after.
  let activeReruns = new Map();

  // Review id → the outcome of its last re-run, when that run failed. A failed
  // re-run leaves the stored review untouched, so without this the card would
  // quietly go back to describing a review the re-run never replaced.
  let failedReruns = new Map();

  function isRerunning(reviewId) {
    return activeReruns.has(reviewId);
  }

  function rerunFailureFor(reviewId) {
    return failedReruns.get(reviewId) ?? null;
  }

  // Deliberately just the fact. Why it failed is in the PR's log, and View Log
  // is in the same footer, so spelling that out here only makes the card shout.
  function rerunNoticeHtml(reviewId) {
    const outcome = rerunFailureFor(reviewId);
    if (outcome === null) return "";
    return `<div class="rerun-failed-note">`
      + `Re-run failed`
      + `<button class="rerun-failed-x" data-id="${escHtml(reviewId)}"`
      + ` onclick="dismissRerunFailure(this)" title="Dismiss" aria-label="Dismiss">✕</button>`
      + `</div>`;
  }

  function rerunElapsedText(reviewId) {
    const startedAt = activeReruns.get(reviewId);
    if (!startedAt) return "";
    const minutes = Math.floor((Date.now() - new Date(startedAt).getTime()) / 60000);
    // Lowercase because .action-chip uppercases its text, so this renders as MIN
    return minutes < 1 ? "just started" : `${minutes} min`;
  }

  async function pollReruns() {
    if (MOCK_MODE) {
      // Seeded onto mocks that exist for these states, so no other card's state
      // is hidden. Every action state is then visible at once in the mock.
      const isSeeded = activeReruns.has("mock-7");
      if (isSeeded) return;
      activeReruns.set("mock-7", new Date(Date.now() - 3 * 60000).toISOString());
      failedReruns.set("mock-8", {
        reviewId: "mock-8",
        endedAt: new Date(Date.now() - 9 * 60000).toISOString(),
        exitCode: 1,
        signal: null,
      });
      applyControls();
      return;
    }

    let running = [];
    let failed = [];
    try {
      const response = await fetch("/api/reruns?nocache=" + Date.now());
      if (!response.ok) return;
      const payload = await response.json();
      running = payload.running ?? [];
      failed = payload.failed ?? [];
    } catch {
      // The in-progress badge is a convenience — a failed poll leaves the last
      // known state rather than wrongly claiming nothing is running
      return;
    }

    const previousRunningIds = new Set(activeReruns.keys());
    const previousFailedIds = [...failedReruns.keys()].sort().join(",");

    activeReruns = new Map(running.map((job) => [job.reviewId, job.startedAt]));
    failedReruns = new Map(failed.map((outcome) => [outcome.reviewId, outcome]));

    const hasFinished = [...previousRunningIds].some((id) => !activeReruns.has(id));
    if (hasFinished) {
      // The run has written its findings, so pull the new record rather than
      // waiting up to a minute for the next scheduled refresh. This re-renders,
      // which is what drops the finished card out of the running state and
      // shows the failure notice if it ended badly.
      await loadReviews();
      return;
    }

    // Re-rendered on every tick while anything runs, so the elapsed time moves.
    // The failure set is compared as well, so a failure this page has not drawn
    // yet — one from before it loaded — appears without waiting for the next
    // scheduled refresh.
    const isAnythingRunning = activeReruns.size > 0;
    const haveFailuresChanged = [...failedReruns.keys()].sort().join(",") !== previousFailedIds;
    if (isAnythingRunning || haveFailuresChanged) applyControls();
  }

  // The one place that couples the action to the polled run state, so
  // deriveReviewAction itself stays a pure function of its arguments
  function actionFor(review) {
    return deriveReviewAction(review, isRerunning(review.id));
  }

  function buildSupportingFacts(review) {
    const facts = [];

    const stateText = REVIEW_STATE_TEXT[review.reviewState ?? "PENDING"];
    if (stateText) facts.push(escHtml(stateText));

    const commitCount = (review.newCommits ?? []).length;
    if (commitCount > 0) {
      facts.push(
        `<span class="fact-link" data-id="${escHtml(review.id)}" data-commits="${escHtml(JSON.stringify(review.newCommits))}" onclick="showCommitsFromBadge(this)">`
        + `${commitCount} new commit${commitCount === 1 ? "" : "s"}</span>`
      );
    }

    const waited = waitingDays(review);
    const isWaitingLong = waited !== null && waited >= 3;
    if (isWaitingLong) facts.push(`waiting ${waited} days`);

    return facts.join(" · ");
  }

  function renderSummary() {
    const bar     = document.getElementById("summary-bar");
    const open    = filteredReviews.filter(r => !r.prStatus || r.prStatus === "open");
    const actions = open.map(actionFor);

    const needsYou   = actions.filter(action => action === "needs-review").length;
    const needsRerun = actions.filter(action => action === "rerun").length;
    const waitingLong = open.filter(r => { const wd = waitingDays(r); return wd !== null && wd >= 3; }).length;
    const ages       = open.map(r => prAgeDays(r));
    const oldest     = ages.length ? Math.max(...ages) : 0;

    bar.innerHTML = `
      <div class="stat"><div class="stat-value">${open.length}</div><div class="stat-label">Open PRs</div></div>
      <div class="stat ${needsYou > 0 ? 'stat-warn' : ''}"><div class="stat-value">${needsYou}</div><div class="stat-label">Needs You</div></div>
      <div class="stat ${needsRerun > 0 ? 'stat-warn' : ''}"><div class="stat-value">${needsRerun}</div><div class="stat-label">Agent Re-run</div></div>
      <div class="stat ${waitingLong > 0 ? 'stat-warn' : ''}"><div class="stat-value">${waitingLong}</div><div class="stat-label">Waiting 3+ Days</div></div>
      <div class="stat ${oldest >= 7 ? 'stat-warn' : ''}"><div class="stat-value">${oldest === 1 ? '1 day' : oldest + ' days'}</div><div class="stat-label">Oldest PR</div></div>
    `;
  }

  let filteredReviews = [];

  function populateRepoFilter() {
    const select = document.getElementById("filter-repo");
    const current = select.value;
    const repos = [...new Set(reviews.map(r => r.repo))].sort();
    select.innerHTML = '<option value="all">All repos</option>' +
      repos.map(r => `<option value="${escHtml(r)}">${escHtml(r)}</option>`).join("");
    if (repos.includes(current)) select.value = current;
  }

  function applyControls() {
    const sort   = document.getElementById("sort-select").value;
    const repo   = document.getElementById("filter-repo").value;
    const action = document.getElementById("filter-action").value;

    filteredReviews = reviews
      .filter(r => repo   === "all" || r.repo === repo)
      .filter(r => action === "all" || actionFor(r) === action);

    filteredReviews.sort((a, b) => {
      // Most urgent action first, then oldest PR within the same action
      if (sort === "attention") {
        const byAction = REVIEW_ACTIONS[actionFor(a)].order - REVIEW_ACTIONS[actionFor(b)].order;
        if (byAction !== 0) return byAction;
        return prAgeDays(b) - prAgeDays(a);
      }
      if (sort === "reviewed-desc") return new Date(b.reviewedAt).getTime() - new Date(a.reviewedAt).getTime();
      if (sort === "age-desc")      return prAgeDays(b) - prAgeDays(a);
      if (sort === "age-asc")       return prAgeDays(a) - prAgeDays(b);
      if (sort === "repo-asc")      return a.repo.localeCompare(b.repo);
      // Nulls sort last for waiting
      if (sort === "waiting-desc")  {
        if (!a.reviewRequestedAt && !b.reviewRequestedAt) return 0;
        if (!a.reviewRequestedAt) return 1;
        if (!b.reviewRequestedAt) return -1;
        return new Date(a.reviewRequestedAt).getTime() - new Date(b.reviewRequestedAt).getTime();
      }
      if (sort === "waiting-asc")   {
        if (!a.reviewRequestedAt && !b.reviewRequestedAt) return 0;
        if (!a.reviewRequestedAt) return 1;
        if (!b.reviewRequestedAt) return -1;
        return new Date(b.reviewRequestedAt).getTime() - new Date(a.reviewRequestedAt).getTime();
      }
      return 0;
    });

    renderCards();
    renderSummary();
  }

  function renderCards() {
    const container = document.getElementById("cards");
    const hasReviews = reviews.length > 0;

    document.getElementById("controls-bar").style.display   = hasReviews ? "" : "none";

    if (!hasReviews) {
      container.innerHTML = `
        <div class="empty">
          <h2>No reviews yet</h2>
          <p>Run <code>npm run review</code> to fetch and review open PRs.</p>
        </div>`;
      return;
    }

    if (filteredReviews.length === 0) {
      container.innerHTML = `
        <div class="empty">
          <h2>No matching reviews</h2>
          <p>Try adjusting the filters above.</p>
        </div>`;
      return;
    }

    container.innerHTML = filteredReviews.map((r, i) => {
      const failed = r.reviewStatus === "failed";
      const cardClass = [
        "card",
        failed ? "card-failed" : "",
        r.prStatus === "merged" ? "card-merged" : "",
        r.prStatus === "closed" ? "card-closed" : "",
      ].filter(Boolean).join(" ");

      const titleClass = failed ? "card-title card-title-failed" : "card-title";

      const metaLine = failed
        ? `${escHtml(r.repo)} · @${escHtml(r.author)} · reviewed ${timeAgo(r.reviewedAt)}`
        : `${escHtml(r.repo)} · @${escHtml(r.author)} · ${r.filesChanged} file${r.filesChanged !== 1 ? "s" : ""} · <span class="diff-add">+${r.additions}</span> <span class="diff-del">−${r.deletions}</span> · ${prAgeDays(r) === 1 ? '1 day old' : prAgeDays(r) + ' days old'}`;

      // One chip answering "what now", with the raw facts demoted beneath it.
      // The chip opens the commit list when there is one, since deciding whether
      // a re-run is really needed means looking at what landed.
      const isRunning   = isRerunning(r.id);
      const actionKey   = actionFor(r);
      const action      = REVIEW_ACTIONS[actionKey];
      // A running agent takes the chip over, so the commit list moves to the
      // supporting facts line rather than competing with it for the click
      const hasCommits  = !isRunning && (r.newCommits ?? []).length > 0;
      const chipClass   = `action-chip action-${action.tone}`
        + (hasCommits ? " action-chip-link" : "")
        + (isRunning ? " action-live" : "");
      const chipHandler = hasCommits
        ? ` data-id="${escHtml(r.id)}" data-commits="${escHtml(JSON.stringify(r.newCommits))}" onclick="showCommitsFromBadge(this)" title="See what changed"`
        : "";
      const chipLabel   = isRunning
        ? `${action.label} · ${escHtml(rerunElapsedText(r.id))}`
        : action.label;

      // The note sits under the facts rather than replacing the chip: the
      // stored status is still true, a re-run having failed does not change it
      const statusPills = `
        <span class="${chipClass}"${chipHandler}>${chipLabel}</span>
        <div class="card-facts">${buildSupportingFacts(r)}</div>
        ${rerunNoticeHtml(r.id)}`;

      const cardBody = failed
        ? `<div class="card-body">
             <p class="failed-message">The review agent failed for this PR. Check the log for details.</p>
           </div>`
        : `<div class="card-body feedback-preview" data-review-idx="${i}" onclick="openReviewModalByIdx(this)">
             ${renderFeedbackPreview(r.feedback)}
           </div>`;

      const cardFooter = `
        <div class="card-footer">
          <div class="footer-actions">
            ${!failed ? `<button class="btn-claude" data-id="${escHtml(r.id)}" onclick="openInClaude(this)">Claude Code</button>` : ""}
            ${isRunning
              ? `<button class="btn-cancel" data-id="${escHtml(r.id)}" onclick="cancelRerun(this)">Cancel run</button>`
              : `<button class="btn-log" data-id="${escHtml(r.id)}" onclick="rerunReview(this)">Re-run agent</button>`}
            ${r.logFile ? `<button class="btn-log" data-id="${escHtml(r.id)}" data-title="${escHtml(r.title)}" onclick="viewLog(this)">View Log</button>` : ""}

          </div>
          ${!failed ? `<span class="read-more" data-review-idx="${i}" onclick="openReviewModalByIdx(this)">Read full review →</span>` : ""}
        </div>`;

      return `
        <div class="${cardClass}" id="card-${i}">
          <div class="card-top-right">
            <span class="ghost-number">#${escHtml(String(r.pull_number))}</span>
            <button class="card-x" data-id="${escHtml(r.id)}" data-idx="${i}" onclick="dismissReview(this)" title="Delete review" aria-label="Delete review">✕</button>
          </div>
          <div class="card-header">
            <div class="card-title-wrap">
              <a class="${titleClass}" href="${r.url}" target="_blank">${escHtml(r.title)} <span class="title-arrow">↗</span></a>
              <div class="meta-line">${metaLine}</div>
              <div class="card-meta">${statusPills}</div>
            </div>
          </div>
          ${cardBody}
          ${cardFooter}
        </div>
      `;
    }).join("");
  }

  function parseFeedbackSections(raw) {
    const sections = {};
    const lines = raw.split('\n');
    let currentSection = null;
    let currentContent = [];
    for (const line of lines) {
      const m = line.match(/^#{1,3}\s+(.+)$/);
      if (m) {
        if (currentSection) sections[currentSection.toLowerCase()] = currentContent.join('\n').trim();
        currentSection = m[1].trim();
        currentContent = [];
      } else if (currentSection) {
        currentContent.push(line);
      }
    }
    if (currentSection) sections[currentSection.toLowerCase()] = currentContent.join('\n').trim();
    return sections;
  }

  function verdictChip(text) {
    if (!text) return '';
    const t = text.toLowerCase();
    let cls = 'verdict-neutral';
    if (/approve|lgtm|looks good/i.test(t)) cls = 'verdict-approve';
    else if (/change|request|revise|update/i.test(t)) cls = 'verdict-changes';
    else if (/reject|block|deny/i.test(t)) cls = 'verdict-reject';
    return `<span class="verdict-chip ${cls}">${escHtml(text.split('\n')[0].trim())}</span>`;
  }

  function renderFeedbackPreview(raw) {
    const sections = parseFeedbackSections(raw);
    const summary = sections['summary'] || sections['overview'] || sections['tldr'] || sections['tl;dr']
      || raw.split(/\n\n/)[0].trim().slice(0, 300);
    const parsed = parseFindings(raw);
    const rollup = parsed ? severityRollup(parsed.findings) : '';
    return `${rollup}<div class="feedback-section-body">${renderInlineMarkdown(summary)}</div>`;
  }

  function renderInlineMarkdown(raw) {
    const cleaned = String(raw).replace(/^---+$/gm, '');
    const escaped = cleaned.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return escaped
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/((?:^[ \t]*[-*] .+\n?)+)/gm, (block) => {
        const items = block.trim().split('\n').map(l => `<li>${l.replace(/^[ \t]*[-*] /, '')}</li>`).join('');
        return `<ul>${items}</ul>`;
      })
      .replace(/\n\n+/g, '</p><p>')
      .replace(/^(?!<[a-z])(.+)$/gm, line => line)
      .replace(/^(?!<(?:ul|ol|li|pre|p))(.+)$/gm, '<p>$1</p>');
  }

  // ── Structured findings: the JSON block the review skill emits ──
  const SEVERITY_CLASS = { BLOCKER: "sev-blocker", WARNING: "sev-warning", NIT: "sev-nit" };
  const SEVERITY_LABEL = { BLOCKER: "Blocker",     WARNING: "Warning",     NIT: "Nit" };

  let currentFindings = [];

  // Returns { findings, before, after } — prose either side of the block — or
  // null when the block is absent or unparseable, so callers can fall back.
  function parseFindings(raw) {
    const text = String(raw ?? "");
    const m = text.match(/```json\s*\n([\s\S]*?)```/);
    if (!m) return null;
    let findings;
    try { findings = JSON.parse(m[1]); } catch { return null; }
    if (!Array.isArray(findings)) return null;
    return {
      findings,
      before: text.slice(0, m.index),
      after:  text.slice(m.index + m[0].length),
    };
  }

  function renderFindingCard(finding, index) {
    const severity      = String(finding.severity ?? "").toUpperCase();
    const severityClass = SEVERITY_CLASS[severity] ?? "sev-nit";
    const severityLabel = SEVERITY_LABEL[severity] ?? (severity ? escHtml(severity) : "Note");
    const filePath      = escHtml(finding.file ?? "unknown");
    const hasLine       = finding.line !== null && finding.line !== undefined && finding.line !== "";

    // With a line, the location doubles as a jump into the diff pane. Without
    // one there is nowhere to jump, so it stays plain text.
    const locationHtml = hasLine
      ? `<span class="finding-loc finding-loc-link" onclick="jumpToDiffFile(${index})" title="Show this line in the diff">${filePath}:${escHtml(String(finding.line))}<span class="finding-jump">↗</span></span>`
      : `<span class="finding-loc">${filePath}<span class="finding-scope">File-level</span></span>`;

    const hasReferences = Array.isArray(finding.references) && finding.references.length > 0;
    const referencesHtml = hasReferences
      ? `<div class="finding-refs">
           <span class="finding-refs-label">Also affects</span>
           ${finding.references.map((reference) => `<span class="finding-ref">${escHtml(reference)}</span>`).join("")}
         </div>`
      : "";

    const isQueued  = queuedCommentsByKey.has(findingKey(finding));
    const isIgnored = ignoredKeys.has(findingKey(finding));
    const stateClass = isQueued ? " queued" : (isIgnored ? " ignored" : "");

    return `
      <div class="finding${stateClass}" id="finding-${index}">
        <div class="finding-head">
          <span class="badge ${severityClass}">${severityLabel}</span>
          ${locationHtml}
          ${finding.check_id ? `<span class="finding-check">${escHtml(finding.check_id)}</span>` : ""}
        </div>
        ${finding.title  ? `<div class="finding-title">${escHtml(finding.title)}</div>` : ""}
        ${finding.detail ? `<div class="finding-detail">${renderInlineMarkdown(finding.detail)}</div>` : ""}
        ${referencesHtml}
        <div class="finding-queue" id="finding-queue-${index}">${renderFindingQueue(index)}</div>
      </div>`;
  }

  function renderFindings(findings) {
    // Held for the context expander and jump handlers, which are keyed by index
    currentFindings = findings;

    if (findings.length === 0) {
      return `<div class="findings-empty">No findings — nothing was flagged on this PR.</div>`;
    }
    return `<div class="findings">${findings.map((finding, index) => renderFindingCard(finding, index)).join("")}</div>`;
  }

  function severityRollup(findings) {
    const counts = { BLOCKER: 0, WARNING: 0, NIT: 0 };
    for (const finding of findings) {
      const severity = String(finding.severity ?? "").toUpperCase();
      if (severity in counts) counts[severity]++;
    }
    const plural = (count, word) => `${count} ${word}${count === 1 ? "" : "s"}`;
    const parts = [];
    if (counts.BLOCKER) parts.push(`<span class="roll roll-blocker">${plural(counts.BLOCKER, "blocker")}</span>`);
    if (counts.WARNING) parts.push(`<span class="roll roll-warning">${plural(counts.WARNING, "warning")}</span>`);
    if (counts.NIT)     parts.push(`<span class="roll roll-nit">${plural(counts.NIT, "nit")}</span>`);
    if (parts.length === 0) parts.push(`<span class="roll roll-clean">No findings</span>`);
    return `<div class="finding-rollup">${parts.join("")}</div>`;
  }

  // ── Per-finding comment queue ──
  // Queued comments are keyed by the finding's identity rather than its array
  // index, so reopening the modal — or re-running an unchanged review — still
  // matches them up, while a finding that genuinely changed stops matching and
  // its stale draft is dropped instead of attaching to the wrong code.
  const QUEUE_STORAGE_PREFIX = "reviewQueue:";

  let queuedCommentsByKey = new Map();
  // Findings deliberately not being commented on. Kept beside the drafts rather
  // than inferred from their absence, because "I decided to skip this" and "I
  // have not looked at this yet" are different states and the card shows both.
  let ignoredKeys = new Set();
  let sentState       = null;   // { keys, positions, reviewId, url } once a draft exists on GitHub
  let lastPartition   = null;   // inline/can't-place split, computed against the diff
  let queueResultHtml = "";     // footer status message, preserved across re-renders
  let wasRegenerated  = false;
  let orphanedPendingUrl = null;   // a pending review left behind by a regeneration
  const findingsBeingEdited = new Set();

  function findingKey(finding) {
    const line    = finding.line ?? "file";
    const checkId = finding.check_id ?? "";
    return `${finding.file ?? "unknown"}:${line}:${checkId}`;
  }

  function loadReviewQueue(review, findings) {
    const empty = {
      drafts: new Map(), ignored: new Set(),
      sent: null, regenerated: false, orphanedPendingUrl: null,
    };
    try {
      const raw = localStorage.getItem(QUEUE_STORAGE_PREFIX + review.id);
      if (!raw) return empty;

      const stored = JSON.parse(raw);

      // A different reviewed SHA means the review was regenerated against new
      // commits. Drafts written against the old analysis could land on lines
      // that have since moved, so the whole set goes rather than being reused.
      const storedSha  = stored.reviewedHeadSha ?? null;
      const currentSha = review.reviewedHeadSha ?? null;
      const isRegenerated = storedSha !== currentSha;
      if (isRegenerated) {
        // Any pending review still exists on GitHub, orphaned from the drafts
        // that produced it, so its url is carried forward for the notice to link
        const carriedUrl = stored.sent?.url ?? stored.orphanedPendingUrl ?? null;
        const hasCarriedUrl = carriedUrl !== null;
        if (hasCarriedUrl) {
          localStorage.setItem(QUEUE_STORAGE_PREFIX + review.id, JSON.stringify({
            reviewedHeadSha: currentSha, drafts: {}, sent: null, orphanedPendingUrl: carriedUrl,
          }));
        } else {
          localStorage.removeItem(QUEUE_STORAGE_PREFIX + review.id);
        }
        // Ignores go with the drafts. A key embeds the finding's line, so a
        // shifted line yields a new key anyway — and an ignore that did survive
        // could silently hide a finding that now matters for a different reason
        // at the same spot.
        return {
          drafts: new Map(), ignored: new Set(),
          sent: null, regenerated: true, orphanedPendingUrl: carriedUrl,
        };
      }

      // Drop drafts whose finding no longer exists in this review
      const liveKeys = new Set(findings.map(findingKey));
      const drafts = new Map();
      for (const [key, text] of Object.entries(stored.drafts ?? {})) {
        const isLive = liveKeys.has(key) && typeof text === "string";
        if (isLive) drafts.set(key, text);
      }

      // Same liveness rule as the drafts: an ignore for a finding this review
      // no longer contains is dropped rather than left to match something else
      const ignored = new Set(
        (Array.isArray(stored.ignored) ? stored.ignored : []).filter((key) => liveKeys.has(key))
      );

      return {
        drafts,
        ignored,
        sent: stored.sent ?? null,
        regenerated: false,
        orphanedPendingUrl: stored.orphanedPendingUrl ?? null,
      };
    } catch {
      // Unreadable or unparseable storage simply means an empty queue
      return empty;
    }
  }

  function saveReviewQueue(review) {
    try {
      const hasAnything = queuedCommentsByKey.size > 0 || ignoredKeys.size > 0
        || sentState !== null || orphanedPendingUrl !== null;
      if (!hasAnything) {
        localStorage.removeItem(QUEUE_STORAGE_PREFIX + review.id);
        return;
      }
      localStorage.setItem(QUEUE_STORAGE_PREFIX + review.id, JSON.stringify({
        reviewedHeadSha: review.reviewedHeadSha ?? null,
        drafts: Object.fromEntries(queuedCommentsByKey),
        ignored: [...ignoredKeys],
        sent: sentState,
        orphanedPendingUrl,
      }));
    } catch {
      // Persistence is a convenience; the queue still works for this session
    }
  }

  function renderFindingQueue(index) {
    const finding = currentFindings[index];
    if (!finding) return "";

    const queuedText = queuedCommentsByKey.get(findingKey(finding));
    const isQueued   = queuedText !== undefined;
    const isEditing  = findingsBeingEdited.has(index);

    if (isEditing) {
      const draft = queuedText ?? finding.comment ?? "";
      return `
        <div class="queue-editor">
          <textarea id="queue-text-${index}" oninput="clearQueueError(${index})" placeholder="What should the PR author see?">${escHtml(draft)}</textarea>
          <div class="queue-editor-actions">
            <button class="btn-queue" onclick="queueComment(${index})">${isQueued ? "Update" : "Queue"}</button>
            <button class="btn-queue-remove" onclick="cancelCommentEditor(${index})">Cancel</button>
            <span class="queue-error" id="queue-error-${index}"></span>
          </div>
        </div>`;
    }

    if (isQueued) {
      return `
        <span class="queue-label">✓ Queued</span>
        <div class="queue-preview">${escHtml(queuedText)}</div>
        <div class="queue-editor-actions">
          <button class="btn-queue" onclick="openCommentEditor(${index})">Edit comment</button>
          <button class="btn-queue-remove" onclick="removeQueuedComment(${index})">Remove</button>
        </div>`;
    }

    const isIgnored = ignoredKeys.has(findingKey(finding));
    if (isIgnored) {
      // Says it is a local decision, because a finding already pushed into a
      // pending review is still sitting in GitHub's draft until it is rebuilt
      const wasSent = sentState !== null && sentState.keys.includes(findingKey(finding));
      const sentNote = wasSent
        ? `<div class="queue-ignored-note">Still in the draft on GitHub — update the review to drop it.</div>`
        : "";
      return `
        <span class="queue-label queue-label-ignored">⊘ Ignored</span>
        <div class="queue-ignored-text">Won't be commented on.</div>
        ${sentNote}
        <div class="queue-editor-actions">
          <button class="btn-queue-remove" onclick="unignoreFinding(${index})">Undo</button>
        </div>`;
    }

    return `
      <div class="queue-actions">
        <button class="btn-queue" onclick="openCommentEditor(${index})">Queue comment</button>
        <button class="btn-queue-remove" onclick="ignoreFinding(${index})">Ignore</button>
      </div>`;
  }

  // Repaints one finding's queue area in place, so expanded diff context and
  // scroll position survive a queue change.
  function refreshFindingQueue(index) {
    const queueElement   = document.getElementById(`finding-queue-${index}`);
    const findingElement = document.getElementById(`finding-${index}`);
    if (!queueElement || !findingElement) return;

    queueElement.innerHTML = renderFindingQueue(index);
    const key = findingKey(currentFindings[index]);
    findingElement.classList.toggle("queued", queuedCommentsByKey.has(key));
    findingElement.classList.toggle("ignored", ignoredKeys.has(key));
  }

  // Readable without opening the modal, so the card footer can warn before a
  // re-run clears drafts the user may have forgotten about
  function storedQueueCounts(reviewId) {
    const empty = { drafts: 0, ignored: 0 };
    try {
      const raw = localStorage.getItem(QUEUE_STORAGE_PREFIX + reviewId);
      if (!raw) return empty;
      const stored = JSON.parse(raw);
      return {
        drafts: Object.keys(stored.drafts ?? {}).length,
        ignored: Array.isArray(stored.ignored) ? stored.ignored.length : 0,
      };
    } catch {
      return empty;
    }
  }

  // Both halves are named, because a re-review clears ignores as well as drafts
  // and losing a deliberate skip is as annoying as losing a drafted comment
  function draftWarningText(counts) {
    const parts = [];
    if (counts.drafts > 0) {
      parts.push(`${counts.drafts} queued comment${counts.drafts === 1 ? "" : "s"}`);
    }
    if (counts.ignored > 0) {
      parts.push(`${counts.ignored} ignored finding${counts.ignored === 1 ? "" : "s"}`);
    }

    const warning = `${parts.join(" and ")} for this review will be cleared once the new one lands.`;

    // Only a draft can be preserved, by pushing it to GitHub first. An ignore
    // lives nowhere else, so offering that advice for one would be misleading.
    const canPreserve = counts.drafts > 0;
    if (!canPreserve) return warning;

    return warning
      + ` Start the review on GitHub first if you want to keep ${counts.drafts === 1 ? "it" : "them"}.`;
  }

  // Returns the run's start time, which the caller records so the card shows
  // the run immediately rather than on the next poll
  async function postRerun(reviewId) {
    if (MOCK_MODE) {
      // Flips the card into the running state so the transition is previewable
      failedReruns.delete(reviewId);
      return new Date().toISOString();
    }

    const response = await fetch(`/api/reviews/${encodeURIComponent(reviewId)}/rerun`, { method: "POST" });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) {
      throw new Error(payload.error ?? `HTTP ${response.status}`);
    }
    return payload.startedAt ?? new Date().toISOString();
  }

  // Two stages when drafts exist: the first click warns, the second launches
  async function rerunReview(button) {
    const reviewId = button.getAttribute("data-id");
    const counts = storedQueueCounts(reviewId);
    const atRisk = counts.drafts + counts.ignored;

    const needsWarning = atRisk > 0 && button.dataset.warned !== "true";
    if (needsWarning) {
      button.dataset.warned = "true";
      button.textContent = `${atRisk} will be cleared — click to re-run anyway`;
      button.title = draftWarningText(counts);
      return;
    }

    const originalText = "Re-run agent";
    button.textContent = "Starting...";
    button.disabled = true;
    try {
      const startedAt = await postRerun(reviewId);
